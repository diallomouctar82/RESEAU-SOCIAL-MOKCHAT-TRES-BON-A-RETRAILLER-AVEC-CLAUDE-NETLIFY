
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0
         sur iOS — le pb-[max(...,env(safe-area-inset-bottom))] du dock mobile
         (Layout.tsx) était donc sans effet sur les iPhone à encoche. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Le Monde à Vous</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              display: ['Outfit', '"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              navy: {
                950: '#070D1E',
                900: '#0B132B',
                800: '#14213D',
                700: '#1E293B',
                600: '#334155',
              },
              accent: {
                DEFAULT: '#EA580C',
                hover: '#C2410C',
                light: '#FFF7ED',
                border: '#FED7AA',
                subtle: '#FB923C',
              },
              // Échelle complétée le 30 août 2026 : 200/300/400/800/950
                // manquaient alors que ~150 occurrences les utilisaient déjà
                // (bg-brand-400, text-brand-300...) à travers Boutique, Wallet,
                // Paramètres, Layout et Commerce. Tailwind ignore silencieusement
                // une teinte non définie — ces classes ne peignaient donc
                // strictement RIEN, sans erreur ni avertissement. Les teintes
                // 200-800 suivent l'échelle bleue standard déjà adoptée par
                // 50/100/500/600/700 ; 900/950 conservent la dérive volontaire
                // vers le navy institutionnel.
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb', // Primary Blue
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#0B132B', // Institutional Deep Navy
                950: '#050A15', // Navy le plus profond (fonds pleine page)
              },
              // Système verre/eau/lumière du LIVE (LOOP 07/14, univers n°9
              // Glassmorphism Crystal Water — prompts 1/7 et 3/7). Teintes du
              // "corps" du verre/de l'eau, distinctes du slate/indigo générique
              // utilisé partout ailleurs dans l'app pour bien signaler que le
              // LIVE a sa propre matière visuelle.
              crystal: {
                deep: '#040B14',    // fond derrière le verre, jamais du noir pur
                glass: '#0C1B2E',   // corps du verre au repos
                water: '#0E293D',   // teinte de l'eau en mouvement
                highlight: '#8FE3FF', // reflet/lumière sur le verre
                foam: '#E8FBFF',    // microbulles/écume, très clair
              },
            },
            keyframes: {
              // Repos : quasi immobile, respiration à peine perceptible.
              'water-idle': {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.9' },
                '50%': { transform: 'scale(1.004)', opacity: '1' },
              },
              // Interaction : légère ondulation à la surface.
              'water-ripple': {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-1px) scale(1.006)' },
              },
              // Commande vocale : onde lumineuse qui traverse le verre.
              'water-wave': {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              // Réflexion (l'IA réfléchit) : mouvements internes subtils, plus lents que l'ondulation.
              'water-reflect': {
                '0%, 100%': { transform: 'translateY(0)' },
                '33%': { transform: 'translateY(-0.5px)' },
                '66%': { transform: 'translateY(0.5px)' },
              },
              // Succès : impulsion positive, brève et nette.
              'water-success': {
                '0%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(143,227,255,0.5)' },
                '40%': { transform: 'scale(1.03)', boxShadow: '0 0 0 8px rgba(143,227,255,0)' },
                '100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(143,227,255,0)' },
              },
              // Erreur : variation discrète, jamais agressive (pas de secousse violente).
              'water-error': {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-1.5px)' },
                '75%': { transform: 'translateX(1.5px)' },
              },
              // Direction artistique Studio Live (image de référence du
              // 30/08/2026) — la matière vivante : l'interface « respire »,
              // sans mouvement brusque ni rupture visuelle.
              // Respiration du verre : très lente, presque imperceptible.
              'water-breathe': {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.0035)', filter: 'brightness(1.03)' },
              },
              // Ondulation de surface : dérive verticale infime — fonctionne
              // sur n'importe quel élément (un background-position n'aurait
              // d'effet que si background-size > 100%, ce qui n'est pas le
              // cas des surfaces de verre).
              'water-undulate': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-0.7px)' },
              },
              // (droplet-float et water-press vivent dans le bloc <style>
              // ci-dessous : ils ne sont consommés que par les classes
              // pleines .water-droplets/.water-ripple-dot — une seule source
              // de vérité, jamais deux définitions du même keyframe.)
              // Grammaire d'états de l'avatar (LOOP 10/14) — 4 états propres
              // à l'avatar, en plus des 6 réutilisés du LOOP 07/14 ci-dessus.
              // Vision active : double impulsion lumineuse (balayage/attention visuelle).
              'avatar-vision': {
                '0%, 100%': { boxShadow: '0 0 16px 2px var(--halo-color)', opacity: '0.85' },
                '25%, 75%': { boxShadow: '0 0 28px 6px var(--halo-color)', opacity: '1' },
              },
              // Compréhension : micro-mouvement ascendant, comme des bulles qui remontent.
              'avatar-comprehension': {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-2px) scale(1.015)' },
              },
              // Action : impulsion décisive et brève, jamais en boucle.
              'avatar-action': {
                '0%': { transform: 'scale(1) rotate(0deg)' },
                '30%': { transform: 'scale(1.06) rotate(-1deg)' },
                '60%': { transform: 'scale(1.02) rotate(0.5deg)' },
                '100%': { transform: 'scale(1) rotate(0deg)' },
              },
              // Incertitude : balancement lent et discret, jamais présenté comme une erreur ni une certitude.
              'avatar-uncertainty': {
                '0%, 100%': { transform: 'translateX(0)', opacity: '0.75' },
                '50%': { transform: 'translateX(3px)', opacity: '0.55' },
              },
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(10px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              'scale-in': {
                '0%': { transform: 'scale(0)' },
                '60%': { transform: 'scale(1.05)' },
                '100%': { transform: 'scale(1)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'breathe': {
                '0%, 100%': { transform: 'scale(1.15) translateY(0)' },
                '50%': { transform: 'scale(1.17) translateY(-2px)' },
              },
              'breathe-fast': {
                '0%, 100%': { transform: 'scale(1.15) translateY(0)' },
                '50%': { transform: 'scale(1.16) translateY(-1px)' },
              },
              'shimmer': {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' }
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.7' },
              },
              'float-up': {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                '100%': { transform: 'translateY(-200px) scale(1.5)', opacity: '0' }
              },
              'fall': {
                '0%': { transform: 'translateY(-100vh) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(100vh) rotate(360deg)', opacity: '0' }
              },
              'slide-across': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100vw)' }
              },
              'pop-in': {
                '0%': { transform: 'scale(0) rotate(-45deg)', opacity: '0' },
                '60%': { transform: 'scale(1.2) rotate(10deg)', opacity: '1' },
                '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' }
              },
              'scan-vertical': {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' }
              }
            },
            animation: {
              'fade-up': 'fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'scale-in': 'scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'breathe': 'breathe 6s ease-in-out infinite',
              'breathe-fast': 'breathe-fast 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'pulse-soft': 'pulse-soft 3s infinite',
              'float-up': 'float-up 2s ease-out forwards',
              'fall': 'fall 3s linear forwards',
              'slide-across': 'slide-across 5s linear forwards',
              'pop-in': 'pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'scan-vertical': 'scan-vertical 2s linear infinite',
              'water-idle': 'water-idle 6s ease-in-out infinite',
              'water-ripple': 'water-ripple 1.6s ease-in-out infinite',
              'water-wave': 'water-wave 1.8s linear infinite',
              'water-reflect': 'water-reflect 2.4s ease-in-out infinite',
              'water-success': 'water-success 0.6s ease-out forwards',
              'water-error': 'water-error 0.4s ease-in-out',
              'avatar-vision': 'avatar-vision 1s ease-in-out infinite',
              'avatar-comprehension': 'avatar-comprehension 1.2s ease-in-out infinite',
              'avatar-action': 'avatar-action 0.5s ease-out',
              'avatar-uncertainty': 'avatar-uncertainty 2.2s ease-in-out infinite',
              'water-breathe': 'water-breathe 9s ease-in-out infinite',
              'water-undulate': 'water-undulate 11s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      /* Utilitaires scrollbar — ~30 composants utilisent .no-scrollbar /
         .scrollbar-none / .scrollbar-thin (onglets Experts, filtres
         Catalogue, Campus, Layout…) alors qu'AUCUNE de ces classes n'était
         définie (Tailwind CDN ne les fournit pas) : les barres système
         pleines s'affichaient, ou rien ne signalait le débordement. */
      .no-scrollbar,
      .scrollbar-none {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar,
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-thin {
        scrollbar-width: thin;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .glass-dark {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .perspective-container {
        perspective: 1000px;
        transform-style: preserve-3d;
      }
      /* Système verre/eau/lumière (LOOP 07/14) — le verre est une matière
         (épaisseur perçue, reflet, profondeur), pas un effet CSS générique
         plaqué partout : bordure claire en haut (lumière qui vient d'en
         haut), légère dégradation vers le bas (profondeur du liquide),
         netteté du contenu jamais compromise (le flou reste sur le fond,
         jamais sur le texte au premier plan — prompt 3/7).

         Cinq univers visuels (LOOP 08/14) : les teintes sont des variables
         CSS avec la valeur "crystal" par défaut sur :root — [data-live-
         universe] (posé sur le conteneur racine du LIVE) les redéfinit pour
         les 4 univers secondaires. Toujours les 2 mêmes classes, jamais une
         famille de classes par univers — une architecture, pas 5 refontes. */
      :root {
        --glass-tint-a: rgba(15, 41, 61, 0.72);
        --glass-tint-b: rgba(4, 11, 20, 0.85);
        --glass-border: rgba(143, 227, 255, 0.18);
        --glass-border-top: rgba(232, 251, 255, 0.35);
        --glass-shadow-inset: rgba(232, 251, 255, 0.12);
        --glass-surface-tint-a: rgba(14, 41, 61, 0.55);
        --glass-surface-tint-b: rgba(12, 27, 46, 0.65);
        --glass-surface-border: rgba(143, 227, 255, 0.14);
        /* Couleur signature de l'univers (direction artistique Studio Live,
           image de référence du 30/08/2026) : l'anneau/la lueur qui identifie
           chaque univers. Consommée par l'onde d'appui, les micro-gouttelettes
           et les accents — jamais une couleur codée en dur par composant. */
        --water-accent: #7dd3fc;
        --water-accent-soft: rgba(125, 211, 252, 0.35);
      }
      /* Palette recalée sur l'image de référence de la direction artistique
         du Studio Live (30/08/2026) : chaque univers reçoit sa couleur
         signature (--water-accent, l'anneau lumineux de l'image) et des
         teintes de verre fidèles aux 7 modèles fournis. */
      /* 1 — Futuriste Bleu : bleu électrique sur nuit profonde. */
      [data-live-universe="futuristic_blue"] {
        --glass-tint-a: rgba(10, 32, 84, 0.75);
        --glass-tint-b: rgba(3, 8, 28, 0.88);
        --glass-border: rgba(80, 165, 255, 0.24);
        --glass-border-top: rgba(170, 216, 255, 0.42);
        --glass-shadow-inset: rgba(170, 216, 255, 0.14);
        --glass-surface-tint-a: rgba(10, 32, 84, 0.55);
        --glass-surface-tint-b: rgba(6, 16, 48, 0.68);
        --glass-surface-border: rgba(80, 165, 255, 0.17);
        --water-accent: #38bdf8;
        --water-accent-soft: rgba(56, 189, 248, 0.35);
      }
      /* 2 — Naturel & Frais : vert vivant, verre plus clair et végétal. */
      [data-live-universe="natural_fresh"] {
        --glass-tint-a: rgba(22, 62, 46, 0.66);
        --glass-tint-b: rgba(8, 26, 19, 0.82);
        --glass-border: rgba(120, 235, 170, 0.22);
        --glass-border-top: rgba(224, 255, 238, 0.38);
        --glass-shadow-inset: rgba(224, 255, 238, 0.13);
        --glass-surface-tint-a: rgba(22, 62, 46, 0.48);
        --glass-surface-tint-b: rgba(12, 36, 27, 0.6);
        --glass-surface-border: rgba(120, 235, 170, 0.15);
        --water-accent: #4ade80;
        --water-accent-soft: rgba(74, 222, 128, 0.32);
      }
      /* 4 — Solaire & Chaud : ambre doré, chaleur de fin de journée. */
      [data-live-universe="solaire_chaud"] {
        --glass-tint-a: rgba(70, 38, 8, 0.72);
        --glass-tint-b: rgba(24, 11, 3, 0.88);
        --glass-border: rgba(251, 176, 64, 0.26);
        --glass-border-top: rgba(255, 220, 160, 0.42);
        --glass-shadow-inset: rgba(255, 220, 160, 0.14);
        --glass-surface-tint-a: rgba(70, 38, 8, 0.52);
        --glass-surface-tint-b: rgba(40, 21, 6, 0.64);
        --glass-surface-border: rgba(251, 176, 64, 0.18);
        --water-accent: #f59e0b;
        --water-accent-soft: rgba(245, 158, 11, 0.33);
      }
      /* 5 — Violet Luxe : violet profond, reflet doré (sensation premium). */
      [data-live-universe="violet_luxe"] {
        --glass-tint-a: rgba(48, 18, 66, 0.74);
        --glass-tint-b: rgba(15, 5, 24, 0.87);
        --glass-border: rgba(202, 145, 255, 0.22);
        --glass-border-top: rgba(255, 222, 170, 0.36);
        --glass-shadow-inset: rgba(255, 222, 170, 0.12);
        --glass-surface-tint-a: rgba(48, 18, 66, 0.52);
        --glass-surface-tint-b: rgba(30, 11, 44, 0.64);
        --glass-surface-border: rgba(202, 145, 255, 0.17);
        --water-accent: #c084fc;
        --water-accent-soft: rgba(192, 132, 252, 0.34);
      }
      /* 6 — Océan Profond : bleu-sarcelle sombre, profondeur marine calme. */
      [data-live-universe="deep_ocean"] {
        --glass-tint-a: rgba(6, 38, 48, 0.78);
        --glass-tint-b: rgba(2, 11, 15, 0.9);
        --glass-border: rgba(64, 205, 216, 0.2);
        --glass-border-top: rgba(158, 242, 242, 0.32);
        --glass-shadow-inset: rgba(158, 242, 242, 0.1);
        --glass-surface-tint-a: rgba(6, 38, 48, 0.56);
        --glass-surface-tint-b: rgba(4, 22, 28, 0.68);
        --glass-surface-border: rgba(64, 205, 216, 0.15);
        --water-accent: #2dd4bf;
        --water-accent-soft: rgba(45, 212, 191, 0.33);
      }
      /* 7 — Rose Doux : rose poudré, douceur et légèreté (verre le plus clair). */
      [data-live-universe="rose_doux"] {
        --glass-tint-a: rgba(88, 36, 58, 0.6);
        --glass-tint-b: rgba(38, 14, 26, 0.8);
        --glass-border: rgba(249, 168, 212, 0.28);
        --glass-border-top: rgba(255, 226, 240, 0.44);
        --glass-shadow-inset: rgba(255, 226, 240, 0.16);
        --glass-surface-tint-a: rgba(88, 36, 58, 0.44);
        --glass-surface-tint-b: rgba(56, 22, 38, 0.58);
        --glass-surface-border: rgba(249, 168, 212, 0.2);
        --water-accent: #f472b6;
        --water-accent-soft: rgba(244, 114, 182, 0.32);
      }
      .glass-crystal {
        background: linear-gradient(180deg, var(--glass-tint-a) 0%, var(--glass-tint-b) 100%);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-top-color: var(--glass-border-top);
        box-shadow: inset 0 1px 0 0 var(--glass-shadow-inset), 0 8px 32px -8px rgba(4, 11, 20, 0.6);
      }
      .glass-crystal-surface {
        background: linear-gradient(180deg, var(--glass-surface-tint-a) 0%, var(--glass-surface-tint-b) 100%);
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        border: 1px solid var(--glass-surface-border);
      }
      /* Halo de l'avatar (LOOP 10/14) — l'avatar est intégré au système
         verre/eau/lumière (couleur portée par --halo-color, posée par
         avatarHaloProps()), pas un élément visuel isolé posé par-dessus.
         inset:0 + ombre INTÉRIEURE (jamais une valeur négative type -6px) :
         les tuiles avatar du LIVE sont systématiquement dans un conteneur
         overflow-hidden (rounded-3xl) — un halo qui déborderait serait
         invisible, tronqué par cet ancêtre. */
      .avatar-halo {
        position: absolute;
        inset: 0;
        /* Valeur fixe (pas "inherit", qui remonterait au conteneur direct
           d'Avatar3D — non arrondi — et non à la tuile rounded-3xl du LIVE
           qui l'englobe) : les tuiles avatar du LIVE utilisent toutes
           rounded-3xl (1.5rem) par convention dans ce dépôt. */
        border-radius: 1.5rem;
        border: 2px solid var(--halo-color, rgba(232, 251, 255, 0.3));
        box-shadow: inset 0 0 28px 4px var(--halo-color, rgba(232, 251, 255, 0.2));
        pointer-events: none;
        z-index: 5;
        transition: border-color 0.4s ease, box-shadow 0.4s ease;
      }
      /* Direction artistique Studio Live (30/08/2026) — la matière vivante.
         Onde d'appui : goutte qui touche une surface d'eau calme. Créée par
         spawnWaterRipple() (services/live/liveMaterialSystem.ts) aux
         coordonnées exactes de l'appui, teintée par l'univers courant via
         --water-accent-soft, retirée du DOM à la fin de l'animation. */
      @keyframes water-press {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0.55; }
        100% { transform: translate(-50%, -50%) scale(14); opacity: 0; }
      }
      .water-ripple-dot {
        position: absolute;
        width: 24px;
        height: 24px;
        border-radius: 9999px;
        background: radial-gradient(circle, var(--water-accent-soft) 0%, transparent 70%);
        border: 1px solid var(--water-accent-soft);
        pointer-events: none;
        z-index: 40;
        animation: water-press 0.65s ease-out forwards;
      }
      /* Micro-gouttelettes lumineuses : trois points de lumière discrets qui
         dérivent très lentement — des reflets, jamais un motif décoratif
         chargé. Superposition passive (pointer-events none), à poser sur les
         grandes surfaces de verre uniquement. */
      @keyframes droplet-float {
        0%, 100% { background-position: 0 0, 40px 60px, 90px 20px; opacity: 0.5; }
        50% { background-position: 2px -8px, 38px 50px, 92px 10px; opacity: 0.8; }
      }
      .water-droplets {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background-image:
          radial-gradient(2px 2px at 12% 30%, var(--water-accent-soft), transparent),
          radial-gradient(1.5px 1.5px at 60% 70%, var(--water-accent-soft), transparent),
          radial-gradient(1px 1px at 85% 15%, var(--water-accent-soft), transparent);
        background-repeat: no-repeat;
        animation: droplet-float 14s ease-in-out infinite;
      }

      /* ================= DS-L1 — STUDIO LIVE, image de référence =========
         Direction arrêtée par la Direction le 03/09/2026 sur une image
         précise : un abysse bleu-vert très sombre, une COLONNE D'EAU
         lumineuse qui sépare les deux zones (la matière fait la mise en
         page, ce n'est pas une bordure), des panneaux de verre à filet
         cyan, la vidéo DANS le verre avec pastille + onde de voix, des
         commandes en orbes ronds, des bulles qui montent À L'INTÉRIEUR des
         cartes, et « ● EN DIRECT » en petites capitales espacées.

         Ces variables sont posées sur [data-live-universe] (attribut porté
         par la racine du LIVE uniquement) et NON sur :root : --water-accent
         de :root est consommé par la goutte de la messagerie (validée le
         01/09) — la recalibrer ici l'aurait déplacée sans qu'on le demande.
         Les 6 autres univers ne redéfinissent que la teinte de l'abysse :
         une architecture, 7 ambiances, jamais 7 familles de classes. */
      [data-live-universe] {
        --live-abyss-a: #0a2430;
        --live-abyss-b: #04121a;
        --live-glow: rgba(127, 217, 230, 0.18);
        --live-line: rgba(160, 235, 245, 0.2);
        --live-line-top: rgba(214, 248, 253, 0.42);
        --live-pane-a: rgba(255, 255, 255, 0.055);
        --live-pane-b: rgba(9, 38, 48, 0.42);
        --live-ink: #e6f8fb;
        --live-ink-soft: #93bcc7;
        --live-accent: var(--water-accent, #7fd9e6);
      }
      [data-live-universe="crystal"] { --live-accent: #7fd9e6; }
      [data-live-universe="futuristic_blue"] {
        --live-abyss-a: #0a1a3a; --live-abyss-b: #03081c;
        --live-glow: rgba(56, 189, 248, 0.18);
      }
      [data-live-universe="natural_fresh"] {
        --live-abyss-a: #0d2a20; --live-abyss-b: #05130e;
        --live-glow: rgba(74, 222, 128, 0.16);
      }
      [data-live-universe="solaire_chaud"] {
        --live-abyss-a: #2a1608; --live-abyss-b: #140902;
        --live-glow: rgba(245, 158, 11, 0.16);
      }
      [data-live-universe="violet_luxe"] {
        --live-abyss-a: #1e0c2c; --live-abyss-b: #0d0417;
        --live-glow: rgba(192, 132, 252, 0.17);
      }
      [data-live-universe="deep_ocean"] {
        --live-abyss-a: #062430; --live-abyss-b: #020c11;
        --live-glow: rgba(45, 212, 191, 0.17);
      }
      [data-live-universe="rose_doux"] {
        --live-abyss-a: #2c1220; --live-abyss-b: #160810;
        --live-glow: rgba(244, 114, 182, 0.16);
      }

      /* L'abysse. Le vignettage est une COUCHE DE FOND (pas un pseudo-élément
         posé par-dessus) : un ::after aurait été peint après tous les enfants
         et aurait assombri la vidéo elle-même. */
      .live-abyss {
        background:
          radial-gradient(150% 100% at 50% 55%, transparent 40%, rgba(0, 0, 0, 0.5) 100%),
          radial-gradient(110% 80% at 50% -5%, var(--live-glow) 0%, transparent 60%),
          linear-gradient(180deg, var(--live-abyss-a) 0%, var(--live-abyss-b) 100%);
      }

      /* La colonne d'eau. Deux nappes de lumière qui dérivent à des vitesses
         différentes derrière un flou : c'est ce décalage qui fait « courant »
         plutôt que « dégradé animé ». Décorative et sous le panneau latéral
         (z-index 1) — jamais au-dessus d'un texte de conversation. */
      @keyframes live-current-drift {
        0%, 100% { transform: translateX(0) scaleX(1); opacity: 0.7; }
        50% { transform: translateX(7px) scaleX(1.12); opacity: 0.95; }
      }
      @keyframes live-current-flow {
        0% { transform: translateY(-14%); }
        100% { transform: translateY(14%); }
      }
      .live-current {
        position: absolute;
        top: -6%;
        bottom: -6%;
        width: 130px;
        pointer-events: none;
        z-index: 1;
        filter: blur(14px);
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--live-glow) 32%,
          rgba(214, 248, 253, 0.3) 50%,
          var(--live-glow) 68%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
        animation: live-current-drift 16s ease-in-out infinite;
      }
      .live-current::before,
      .live-current::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 22% at 50% 20%, rgba(224, 250, 255, 0.5), transparent 70%),
          radial-gradient(45% 18% at 40% 62%, rgba(224, 250, 255, 0.32), transparent 70%);
        animation: live-current-flow 22s linear infinite alternate;
      }
      .live-current::after {
        animation-duration: 31s;
        animation-direction: alternate-reverse;
        opacity: 0.6;
      }
      /* Variante horizontale : sur téléphone la couture scène/panneau est
         horizontale — le courant la suit au lieu de disparaître. */
      .live-current--h {
        top: auto;
        bottom: auto;
        left: -6%;
        right: -6%;
        width: auto;
        height: 110px;
        background: linear-gradient(
          180deg,
          transparent 0%,
          var(--live-glow) 32%,
          rgba(214, 248, 253, 0.28) 50%,
          var(--live-glow) 68%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
      }

      /* Le panneau de verre des tuiles : filet cyan, arête haute plus claire
         (la lumière vient d'en haut), lueur intérieure, ombre portée douce. */
      .live-pane {
        position: relative;
        border-radius: 20px;
        background: linear-gradient(180deg, var(--live-pane-a) 0%, var(--live-pane-b) 100%);
        border: 1px solid var(--live-line);
        border-top-color: var(--live-line-top);
        box-shadow:
          inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
          inset 0 0 40px -12px var(--live-glow),
          0 18px 40px -20px rgba(0, 0, 0, 0.85);
        overflow: hidden;
      }
      /* Une présence IA se distingue par une arête plus vive et une lueur
         intérieure plus marquée — jamais par une couleur étrangère à
         l'univers courant (color-mix évité : pas garanti sur Safari 16.0). */
      .live-pane--agent {
        border-color: var(--live-line-top);
        box-shadow:
          inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
          inset 0 0 56px -10px var(--live-glow),
          0 18px 40px -20px rgba(0, 0, 0, 0.85);
      }

      /* Commande en orbe. Le halo s'intensifie au survol/à l'appui : la
         lumière confirme, elle ne décore pas. */
      .live-orb {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.22), rgba(10, 42, 54, 0.55) 70%);
        border: 1px solid var(--live-line);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 14px -4px rgba(0, 0, 0, 0.7);
        color: var(--live-ink);
        transition: box-shadow 0.25s ease, transform 0.2s ease, background 0.25s ease;
      }
      .live-orb:hover {
        transform: translateY(-1px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 18px -4px rgba(0, 0, 0, 0.75), 0 0 18px 2px var(--live-glow);
      }
      /* L'accent doit DOMINER : à 130 %, le dégradé restait quasi blanc et
         l'action principale du Studio passait pour une case grise. */
      .live-orb--active {
        background: radial-gradient(circle at 32% 18%, rgba(255, 255, 255, 0.38), var(--live-accent) 72%);
        border-color: var(--live-line-top);
        color: #04202a;
        text-shadow: none;
      }
      .live-orb--danger {
        background: radial-gradient(circle at 35% 25%, rgba(255, 190, 190, 0.35), rgba(190, 40, 60, 0.9) 75%);
        border-color: rgba(255, 140, 150, 0.45);
        color: #fff;
      }

      /* MB-1 — Une commande qui n'apparaît qu'au SURVOL n'existe pas sur un
         téléphone : il n'y a pas de curseur. `opacity-0 group-hover:opacity-100`
         la rendait donc définitivement invisible au doigt (mesuré au banc :
         opacité effective 0 au repos, 390×844). Elle reste désormais visible
         partout où le survol n'existe pas, et garde son effacement au repos
         sur un ordinateur — là où le survol est réel. */
      .live-hover-reveal { opacity: 1; }
      @media (hover: hover) and (pointer: fine) {
        .live-hover-reveal { opacity: 0; transition: opacity 0.2s ease; }
        .group:hover .live-hover-reveal,
        .live-hover-reveal:hover,
        .live-hover-reveal:focus-within { opacity: 1; }
      }

      /* « ● EN DIRECT » : petites capitales espacées, point vert qui respire. */
      @keyframes live-onair-pulse {
        0%, 100% { opacity: 1; box-shadow: 0 0 8px 2px rgba(61, 220, 151, 0.7); }
        50% { opacity: 0.55; box-shadow: 0 0 3px 1px rgba(61, 220, 151, 0.35); }
      }
      .live-onair {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #9fe8f2;
      }
      .live-onair::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: #3ddc97;
        animation: live-onair-pulse 2.4s ease-in-out infinite;
      }

      /* Titre de zone : fin, très espacé, en capitales — le registre exact
         de « MON ESPACE CITOYEN » / « CONSULTATION AVEC EXPERTS ». */
      .live-title {
        font-weight: 300;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--live-ink);
      }

      /* Onde de voix : la voix devient visible à côté du visage — on sait
         qui parle sans avoir à le deviner. */
      @keyframes live-wave-bar {
        0%, 100% { transform: scaleY(0.32); }
        50% { transform: scaleY(1); }
      }
      .live-wave {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 16px;
      }
      .live-wave i {
        display: block;
        width: 2px;
        height: 100%;
        border-radius: 2px;
        background: var(--live-accent);
        transform-origin: center;
        animation: live-wave-bar 1.1s ease-in-out infinite;
        opacity: 0.9;
      }
      .live-wave--muted i {
        animation: none;
        transform: scaleY(0.22);
        opacity: 0.4;
      }

      /* Plaque de nom : dégradé de lisibilité + capitales espacées. */
      .live-nameplate {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 2.1rem 0.85rem 0.7rem;
        background: linear-gradient(180deg, transparent 0%, rgba(3, 16, 22, 0.78) 55%, rgba(3, 16, 22, 0.93) 100%);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--live-ink);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      /* MB-1 — sur un téléphone, une carte de scène fait environ 150 px de
         large. Le nom et le rôle côte à côte ne laissaient que trois lettres
         au NOM (mesuré à l'écran : « SAR… ANIMATEUR », « FAT… SUR SCÈNE »)
         alors que le nom est l'information principale. En dessous de 640 px
         ils s'empilent donc : le nom prend toute la largeur, le rôle passe
         dessous, plus petit et plus discret. Au-delà, la rangée d'origine
         est conservée telle quelle. */
      /* MB-1 — sur téléphone, « EN DIRECT » à 0.18em d'espacement mangeait
         près de 100 px d'une barre de 390 px. L'espacement se resserre : le
         mot reste en petites capitales, il occupe simplement sa place. */
      @media (max-width: 639px) {
        .live-onair { letter-spacing: 0.08em; }
      }

      @media (max-width: 639px) {
        .live-nameplate {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-end;
          gap: 0.05rem;
          padding-bottom: 0.55rem;
        }
        .live-nameplate > * { max-width: 100%; }
        .live-nameplate .live-nameplate-role {
          font-size: 9px;
          letter-spacing: 0.14em;
          opacity: 0.68;
        }
      }

      /* Bulles qui montent DANS la carte (la vie est dans les contenants, pas
         seulement dans le fond). Jamais au-dessus d'une vidéo réelle : elles
         n'habillent que les tuiles sans image (agent, attente, débordement). */
      @keyframes live-bubble-rise {
        0% { transform: translateY(0) scale(0.85); opacity: 0; }
        14% { opacity: 0.55; }
        100% { transform: translateY(-150px) scale(1.05); opacity: 0; }
      }
      .live-bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        border-radius: inherit;
      }
      .live-bubbles span {
        position: absolute;
        bottom: -16px;
        border-radius: 9999px;
        background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.55), rgba(160, 235, 245, 0.1) 60%, transparent 72%);
        border: 1px solid rgba(200, 245, 252, 0.28);
        animation: live-bubble-rise 9s ease-in infinite;
      }

      /* Mouvement réduit : la matière se fige, la lisibilité reste entière. */
      @media (prefers-reduced-motion: reduce) {
        .live-current,
        .live-current::before,
        .live-current::after,
        .live-bubbles span,
        .live-wave i,
        .live-onair::before {
          animation: none !important;
        }
      }

      /* Bouton de messagerie « Goutte » (mission VF-10, maquette n° 01
         validée le 01/09/2026 — components/chat/MessagingDropButton.tsx).
         Une goutte de verre épais où flotte un niveau d'eau : le prolongement
         hors-live de la matière verre/eau/lumière ci-dessus. Le niveau
         (--mdb-lvl) est posé en style inline par le composant à partir du VRAI
         nombre de non-lus ; l'état (data-state) pilote la vitesse de l'eau, la
         teinte d'appel, l'anneau et l'icône. Keyframes `mdb-*` définis ICI
         uniquement (classes pleines, jamais des utilitaires Tailwind). */
      .mdb-host {
        display: inline-grid;
      }
      /* Spécificité nulle : la classe de position fournie par le parent
         (fixed/absolute) gagne toujours, quel que soit l'ordre des feuilles. */
      :where(.mdb-host) {
        position: relative;
      }
      .mdb {
        --mdb-lvl: 30%; /* niveau d'eau (style inline du composant) */
        --mdb-lift: 0%; /* gonflement de l'eau au survol */
        --mdb-wv: 7s; /* période de la vague : lente au repos */
        --mdb-acc: var(--water-accent, #7dd3fc); /* accent = anneau, compteur */
        --mdb-call: #059669; /* vert réservé à l'appel entrant */
        --mdb-focus: #1d4ed8;
        position: relative;
        width: 64px;
        height: 64px;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #fff;
        font: inherit;
        border-radius: 50%;
        isolation: isolate;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3);
      }
      .mdb > * {
        pointer-events: none;
      }
      .mdb:focus-visible {
        outline: 3px solid var(--mdb-focus);
        outline-offset: 5px;
      }
      /* Le verre : lumière par le haut (reflet radial + liseré clair),
         profondeur vers le bas, bord fin teinté highlight. */
      .mdb-glass {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 1;
        background:
          radial-gradient(circle at 34% 26%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 38%),
          linear-gradient(180deg, rgba(20, 47, 78, 0.88), rgba(4, 11, 20, 0.96));
        box-shadow:
          inset 0 1px 0 rgba(232, 251, 255, 0.55),
          inset 0 -10px 18px rgba(143, 227, 255, 0.14),
          inset 0 0 0 1px rgba(143, 227, 255, 0.24),
          0 12px 26px -10px rgba(4, 11, 20, 0.7);
        backdrop-filter: blur(6px) saturate(140%);
        -webkit-backdrop-filter: blur(6px) saturate(140%);
      }
      /* L'eau : deux ellipses qui tournent en sens inverse, la surface est
         leur bord supérieur, placé à 100 % − niveau. */
      .mdb-liquid {
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        overflow: hidden;
        z-index: 2;
        transform: translateZ(0);
      }
      .mdb-wave {
        position: absolute;
        left: -50%;
        top: calc(100% - var(--mdb-lvl) - var(--mdb-lift));
        width: 200%;
        aspect-ratio: 1;
        border-radius: 41%;
        background: rgba(56, 189, 248, 0.62);
        animation: mdb-turn var(--mdb-wv) linear infinite;
        transition: top 0.9s cubic-bezier(0.3, 1.2, 0.4, 1), background 0.5s;
      }
      .mdb-wave.mdb-w2 {
        border-radius: 44%;
        background: rgba(143, 227, 255, 0.32);
        animation-duration: calc(var(--mdb-wv) * 1.45);
        animation-direction: reverse;
      }
      @keyframes mdb-turn {
        to { transform: rotate(360deg); }
      }
      /* Micro-bulles : trois points de lumière qui montent, décalés. */
      .mdb-bubbles {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        overflow: hidden;
        z-index: 3;
      }
      .mdb-bubbles i {
        position: absolute;
        bottom: 6px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(232, 251, 255, 0.85);
        box-shadow: 0 0 4px rgba(232, 251, 255, 0.6);
        opacity: 0;
        animation: mdb-bubble 5.5s ease-in infinite;
      }
      .mdb-bubbles i:nth-child(1) { left: 30%; }
      .mdb-bubbles i:nth-child(2) { left: 55%; width: 3px; height: 3px; animation-delay: 1.9s; animation-duration: 6.5s; }
      .mdb-bubbles i:nth-child(3) { left: 68%; animation-delay: 3.4s; animation-duration: 4.8s; }
      @keyframes mdb-bubble {
        0% { transform: translate(0, 0); opacity: 0; }
        12% { opacity: 0.9; }
        60% { transform: translate(2px, -30px); opacity: 0.7; }
        100% { transform: translate(-2px, -46px); opacity: 0; }
      }
      .mdb-gloss {
        position: absolute;
        left: 19%;
        top: 11%;
        width: 36%;
        height: 20%;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
        z-index: 4;
        transform: rotate(-18deg);
      }
      /* L'anneau : onde au survol, propagation à l'appel, cercle plein ouvert. */
      .mdb-ring {
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 2px solid var(--mdb-acc);
        opacity: 0;
        transform: scale(0.88);
        z-index: 0;
        transition: opacity 0.3s, transform 0.4s;
      }
      /* Icônes superposées, fondu + rotation d'une à l'autre. */
      .mdb-ico {
        position: relative;
        z-index: 5;
        width: 26px;
        height: 26px;
      }
      .mdb-ico svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity 0.28s ease, transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.3);
        filter: drop-shadow(0 1px 1.5px rgba(4, 11, 20, 0.45));
      }
      .mdb-ico .mdb-i-x,
      .mdb-ico .mdb-i-ph {
        opacity: 0;
        transform: scale(0.55) rotate(-60deg);
      }
      .mdb[data-state="open"] .mdb-i-bub,
      .mdb[data-state="call"] .mdb-i-bub {
        opacity: 0;
        transform: scale(0.55) rotate(60deg);
      }
      .mdb[data-state="open"] .mdb-i-x {
        opacity: 1;
        transform: none;
      }
      .mdb[data-state="call"] .mdb-i-ph {
        opacity: 1;
        transform: none;
        animation: mdb-phone-ring 1.1s ease-in-out infinite;
      }
      @keyframes mdb-phone-ring {
        0%, 100% { transform: rotate(0); }
        15% { transform: rotate(-14deg); }
        30% { transform: rotate(12deg); }
        45% { transform: rotate(-8deg); }
        60% { transform: rotate(6deg); }
        75% { transform: rotate(0); }
      }
      /* Compteur : navy sur accent (contraste > 10:1), cerclé de la couleur
         du fond de page (--mdb-badge-ring, à redéfinir sur fond sombre). */
      .mdb-badge {
        position: absolute;
        z-index: 6;
        top: -3px;
        right: -3px;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 11px;
        background: var(--mdb-acc);
        color: #0b132b;
        font: 700 12px/22px ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        text-align: center;
        box-shadow: 0 0 0 2px var(--mdb-badge-ring, #f9fafb);
        animation: mdb-badge-in 0.38s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      @keyframes mdb-badge-in {
        from { transform: scale(0); }
        to { transform: scale(1); }
      }
      /* Survol (pointeur fin seulement : pas de survol collant au toucher) :
         la goutte gonfle, l'eau monte un peu, l'onde s'éloigne. */
      @media (hover: hover) {
        .mdb:hover {
          --mdb-lift: 8%;
          transform: scale(1.05);
        }
        .mdb:hover .mdb-ring {
          opacity: 0.55;
          transform: scale(1);
        }
        .mdb[data-state="open"]:hover {
          --mdb-lift: 0%;
        }
      }
      .mdb:active {
        transform: scale(0.96);
      }
      /* Appel entrant : l'eau s'agite et vire au vert, l'anneau se propage. */
      .mdb[data-state="call"] {
        --mdb-wv: 1.5s;
        --mdb-acc: var(--mdb-call);
      }
      .mdb[data-state="call"] .mdb-ring {
        animation: mdb-ring 1.4s ease-out infinite;
      }
      .mdb[data-state="call"] .mdb-wave {
        background: rgba(52, 211, 153, 0.55);
      }
      .mdb[data-state="call"] .mdb-wave.mdb-w2 {
        background: rgba(110, 231, 183, 0.3);
      }
      @keyframes mdb-ring {
        0% { opacity: 0.9; transform: scale(0.86); }
        100% { opacity: 0; transform: scale(1.5); }
      }
      /* Ouvert : la goutte est pleine et calme, l'anneau reste posé. */
      .mdb[data-state="open"] {
        --mdb-wv: 16s;
      }
      .mdb[data-state="open"] .mdb-ring {
        opacity: 0.8;
        transform: scale(1);
      }
      /* Étiquette d'installation (maintien long) : à gauche de la goutte.
         Teintes en variables (--mdb-install-*) : blanc/navy sur l'app
         claire, redéfinissables par un conteneur sombre. */
      .mdb-install {
        position: absolute;
        right: calc(100% + 12px);
        top: 50%;
        transform: translate(8px, -50%);
        width: max-content;
        max-width: min(190px, calc(100vw - 120px));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border-radius: 12px;
        background: var(--mdb-install-bg, #ffffff);
        color: var(--mdb-install-ink, #0b132b);
        font: 600 12px/1.3 "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        border: 1px solid var(--mdb-install-line, #dce3ee);
        box-shadow: 0 10px 26px -10px var(--mdb-install-shadow, rgba(11, 19, 43, 0.28));
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .mdb-install svg {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mdb-install[data-visible="true"] {
        opacity: 1;
        transform: translate(0, -50%);
      }
      /* Mouvement réduit : décor figé (eau immobile, pas de bulles ni de
         vibration du combiné) ; le niveau d'eau et les états restent lisibles,
         l'appel devient une lente pulsation d'opacité de l'anneau. */
      @media (prefers-reduced-motion: reduce) {
        .mdb-wave,
        .mdb-bubbles i,
        .mdb-badge,
        .mdb[data-state="call"] .mdb-i-ph {
          animation: none !important;
        }
        .mdb[data-state="call"] .mdb-ring {
          animation: mdb-pulse 2.2s ease-in-out infinite !important;
          transform: none !important;
        }
        .mdb,
        .mdb *,
        .mdb-install {
          transition-duration: 0.15s !important;
        }
      }
      @keyframes mdb-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      /* L'interface respire — mais jamais contre la volonté de l'utilisateur :
         toute animation décorative de la matière est désactivée quand le
         système demande une réduction du mouvement. Les animations d'ÉTAT
         (succès/erreur) portent du sens et ne sont pas concernées. */
      @media (prefers-reduced-motion: reduce) {
        .water-ripple-dot,
        .water-droplets,
        .animate-water-breathe,
        .animate-water-undulate,
        .animate-water-idle,
        .animate-water-ripple,
        .animate-water-reflect {
          animation: none !important;
        }
      }

      /* ══════════════════════════════════════════════════════════════════
         MENU « MIROIR D'EAU » — habillage verre/eau (DS-M2b)
         Proposition 06 choisie par la Direction le 3 septembre 2026, portée
         depuis `design-lab/menu-06-miroir-eau.html` (thème `.t6`).

         Tout est SCOPÉ sous `[data-miroir]`, posé par Layout.tsx sur la
         racine de l'application. Aucune de ces règles ne touche :
           - `contexts/ThemeContext.tsx` / `components/ui/DesignTokens.ts`
             (les 10 palettes de marque, palette-10 par défaut, gelées par une
             décision antérieure de la Direction pour toutes les surfaces pas
             encore redessinées — la barre latérale desktop continue donc de
             tirer ses couleurs de palette-10, voir la note dans Layout.tsx) ;
           - le système verre/eau/lumière du LIVE (`[data-live-universe]`,
             classes `.water-*`), qui a sa propre matière et ses 7 univers ;
           - la goutte de la messagerie (`.mdb-*`), déjà en matière d'eau
             depuis VF-10 — elle ne reçoit ici que l'arête de lumière et le
             reflet qui lui manquaient.

         Les valeurs sont des variables CSS et non des couleurs en dur : c'est
         ce qui permettra à l'Administrateur Général de proposer plus tard
         d'autres univers sans retoucher un seul composant. Ce sélecteur
         d'univers n'est PAS construit ici (hors périmètre, lot 1 point 3).
         ══════════════════════════════════════════════════════════════════ */
      [data-miroir] {
        --mir-bg: #EAF7FB;
        --mir-ink: #0B3A46;
        --mir-acc: #0F9EC2;
        --mir-pros: #12A579;
        --mir-pros-glow: rgba(18, 165, 121, 0.55);
        /* Bandeaux de chrome (en-têtes) : verre très transparent. */
        --mir-band: rgba(255, 255, 255, 0.44);
        --mir-band-bd: rgba(255, 255, 255, 0.7);
        /* Panneaux « glass » (carte Réseau Mooc, rail des stories, dock). */
        --mir-panel: rgba(255, 255, 255, 0.44);
        --mir-panel-solid: #EEF9FC;
        /* Feuilles « sheet » : les publications du fil, où l'on LIT — la
           maquette elle-même les met à 0.94 et non à 0.44, parce qu'un texte
           de paragraphe ne se lit pas à travers de l'eau. */
        --mir-sheet: rgba(255, 255, 255, 0.94);
        --mir-sheet-bd: rgba(255, 255, 255, 0.9);
        --mir-exp: rgba(255, 255, 255, 0.58);
        --mir-bd: rgba(255, 255, 255, 0.85);
        --mir-blur: blur(20px) saturate(1.2);
        --mir-hi: rgba(255, 255, 255, 0.95);
        --mir-lo: rgba(11, 58, 70, 0.05);
        --mir-spec: linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent 40%);
        --mir-sh-sm: 0 10px 22px -10px rgba(10, 70, 90, 0.32);
        --mir-sh-md: 0 18px 40px -20px rgba(10, 70, 90, 0.4);
        --mir-sh-lg: 0 28px 56px -24px rgba(10, 70, 90, 0.45);
        /* L'Architecte : une goutte d'eau soufflée, pas un bouton rond. */
        --mir-arch-shape: 50% 50% 46% 46% / 58% 58% 42% 42%;
        --mir-arch-bg: radial-gradient(circle at 36% 28%, #FFFFFF 0 12%, #BFF3FF 30%, #3FC7E0 66%, #0E7A93 100%);
        --mir-arch-ring: rgba(191, 243, 255, 0.65);
        --mir-arch-sh: 0 14px 30px -12px rgba(10, 70, 90, 0.55),
          inset 0 -6px 12px rgba(0, 60, 75, 0.16),
          inset 0 4px 10px rgba(255, 255, 255, 0.75);
        background: var(--mir-bg);
        color: var(--mir-ink);
      }

      /* La nappe d'eau (components/miroir/WaterMirror.tsx) : purement
         décorative, sous tout le reste, jamais cliquable. */
      [data-miroir] .mir-scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        display: block;
      }
      /* Tout le contenu réel de l'application passe AU-DESSUS de l'eau.
         On ne touche SURTOUT PAS `position` ici : les deux en-têtes sont en
         `sticky`, et ce sélecteur (0,2,0) l'emporterait sur la classe
         Tailwind `.sticky` (0,1,0) — les en-têtes cesseraient de coller en
         haut de l'écran. Un `z-index` seul suffit : les enfants de la racine
         sont des éléments flex, et un élément flex honore `z-index` même en
         position statique.

         `:not(header)` — LE MÊME PIÈGE, une ligne plus bas. Ce sélecteur
         (0,2,0) l'emporte aussi sur les classes `.z-20` / `.z-30` (0,1,0) que
         portent les deux en-têtes. Sans cette exclusion, les en-têtes tombent
         à 1, à égalité avec le conteneur principal qui est écrit APRÈS eux :
         l'ordre du document tranche, le conteneur peint par-dessus, et les
         menus déroulants ancrés sous l'en-tête (langue, Notifications, et le
         menu Compte qui porte la DÉCONNEXION) deviennent inatteignables.
         Mesuré en navigateur réel sur la page servie : `elementFromPoint` au
         centre de « Se déconnecter » renvoyait une carte `.bg-white` du fil,
         jamais le bouton. Les en-têtes gardent donc leur z Tailwind. */
      [data-miroir] > *:not(.mir-scene):not(header) {
        z-index: 1;
      }

      /* Bandeau de verre : les deux en-têtes (mobile et desktop). */
      [data-miroir] .mir-band {
        background: var(--mir-band);
        border-bottom: 1px solid var(--mir-band-bd);
        backdrop-filter: var(--mir-blur);
        -webkit-backdrop-filter: var(--mir-blur);
        color: var(--mir-ink);
      }

      /* Panneau de verre soufflé : reflet spéculaire en haut, arêtes
         internes claire et sombre — c'est ce qui donne l'épaisseur. */
      [data-miroir] .mir-glass,
      [data-miroir] .mir-sheet,
      [data-miroir] .mir-dock {
        position: relative;
        border: 1px solid var(--mir-bd);
        backdrop-filter: var(--mir-blur);
        -webkit-backdrop-filter: var(--mir-blur);
        box-shadow: var(--mir-sh-md), inset 0 1px 0 var(--mir-hi), inset 0 -1px 0 var(--mir-lo);
      }
      [data-miroir] .mir-glass::before,
      [data-miroir] .mir-dock::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: var(--mir-spec);
      }
      [data-miroir] .mir-glass {
        background: var(--mir-panel);
      }
      [data-miroir] .mir-sheet {
        background: var(--mir-sheet);
        border-color: var(--mir-sheet-bd);
        box-shadow: var(--mir-sh-sm);
      }
      [data-miroir] .mir-exp {
        background: var(--mir-exp);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow: var(--mir-sh-md);
      }
      /* Un utilisateur qui demande moins de transparence obtient du verre
         opaque, pas une bouillie illisible. */
      @media (prefers-reduced-transparency: reduce) {
        [data-miroir] .mir-band,
        [data-miroir] .mir-glass,
        [data-miroir] .mir-dock,
        [data-miroir] .mir-exp {
          background: var(--mir-panel-solid);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }

      /* Le dock : une pilule de verre soufflé posée sur l'eau. */
      [data-miroir] .mir-dock {
        background: var(--mir-panel);
        box-shadow: var(--mir-sh-lg), inset 0 1px 0 var(--mir-hi), inset 0 -1px 0 var(--mir-lo);
      }
      /* L'arête de lumière qui tourne en continu autour du verre — le
         « dock pilule » du repère de la Direction. */
      [data-miroir] .mir-edge::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        padding: 1.4px;
        background: conic-gradient(
          from var(--mir-sp, 0deg),
          transparent 0 74%,
          rgba(255, 255, 255, 0.95) 84%,
          rgba(159, 230, 255, 1) 91%,
          transparent 98%
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        animation: mir-edge 9s linear infinite;
      }
      /* Sans cette déclaration, `--mir-sp` reste une chaîne pour le moteur
         CSS : l'animation sauterait de 0 à 360° au lieu de faire tourner
         l'arête. C'est la même mécanique que `--rg` dans la maquette. */
      @property --mir-sp {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes mir-edge {
        to {
          --mir-sp: 360deg;
        }
      }
      /* L'eau reflète ce qui flotte dessus (dock et goutte). */
      [data-miroir] .mir-reflect {
        -webkit-box-reflect: below 4px linear-gradient(transparent 40%, rgba(10, 70, 90, 0.28));
      }

      /* La goutte de la messagerie (VF-10) : elle est DÉJÀ en matière d'eau,
         on ne la reconstruit pas. Elle reçoit seulement les deux effets de la
         proposition 06 qui lui manquaient — l'arête de lumière et le reflet.
         Purement CSS, en visant `.mdb` depuis ce périmètre : aucune ligne de
         `MessagingDropButton.tsx` n'est touchée, donc ses quatre états
         (repos / non-lus / appel / ouvert) et leurs tests restent intacts.
         L'arête tourne avec 4 s de décalage sur celle du dock, pour que les
         deux ne s'allument jamais en même temps. */
      [data-miroir] .mdb {
        -webkit-box-reflect: below 4px linear-gradient(transparent 40%, rgba(10, 70, 90, 0.28));
      }
      [data-miroir] .mdb::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        padding: 1.4px;
        background: conic-gradient(
          from var(--mir-sp, 0deg),
          transparent 0 74%,
          rgba(255, 255, 255, 0.95) 84%,
          rgba(159, 230, 255, 1) 91%,
          transparent 98%
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        animation: mir-edge 9s linear infinite -4s;
      }

      /* L'Architecte, au centre de la navigation principale : une goutte
         d'eau soufflée avec sa lumière interne, son point spéculaire et son
         anneau qui respire. Invariant Direction — un seul flottant à
         l'écran (la goutte messagerie), l'Architecte vit dans le dock. */
      [data-miroir] .mir-orb {
        border-radius: var(--mir-arch-shape);
        background: var(--mir-arch-bg);
        border: 2px solid rgba(255, 255, 255, 0.85);
        color: #0E4C5C;
        box-shadow: var(--mir-arch-sh);
      }
      [data-miroir] .mir-orb::before {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: var(--mir-arch-shape);
        border: 1.5px solid var(--mir-arch-ring);
        pointer-events: none;
        animation: mir-pulse 4.2s ease-in-out infinite;
      }
      /* Le point de lumière sur le flanc de la goutte : c'est lui qui la
         fait lire comme du verre plein et non comme un disque coloré. */
      [data-miroir] .mir-orb::after {
        content: '';
        position: absolute;
        left: 23%;
        top: 15%;
        width: 28%;
        height: 20%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        filter: blur(1.4px);
        pointer-events: none;
      }
      @keyframes mir-pulse {
        0%, 100% {
          transform: scale(0.9);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.18);
          opacity: 0;
        }
      }

      /* L'emplacement actif du dock : la lumière dit où l'on est (idée
         retenue du repère « Model 14 » de la Direction). */
      [data-miroir] .mir-tab-active {
        color: var(--mir-acc);
      }
      [data-miroir] .mir-tab-active::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 2px;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: var(--mir-pros);
        box-shadow: 0 0 8px 2px var(--mir-pros-glow);
      }

      /* « L'interface déclare son état » — la ligne de mode du repère
         « Model 14 », reprise telle quelle par la proposition 06. */
      [data-miroir] .mir-mode {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mir-ink);
        opacity: 0.7;
      }

      @media (prefers-reduced-motion: reduce) {
        [data-miroir] .mir-edge::after,
        [data-miroir] .mdb::after {
          display: none;
        }
        [data-miroir] .mir-orb::before {
          animation: none;
        }
        /* `unset` et non `none` : Chromium IGNORE silencieusement
           `-webkit-box-reflect: none` (valeur calculée inchangée, aucun
           avertissement) — vérifié au banc, le reflet survivait à la demande
           de mouvement réduit. Même famille de piège que les teintes
           `brand-*` absentes de la config Tailwind : une déclaration qui ne
           peint rien sans le dire. */
        [data-miroir] .mir-reflect,
        [data-miroir] .mdb {
          -webkit-box-reflect: unset;
        }
      }
      /* ===================================================================
         ZONES DE SAISIE — CONTOURS RENFORCÉS (DEC-2026-053)
         Demande de la Direction : « les lignes de contour doivent être plus
         visibles pour qu'on comprenne immédiatement où écrire ». Le dépôt
         compte ~450 champs (<input>/<textarea>) bordés au cas par cas en
         `border-slate-200` ou `border-gray-300` — un trait presque invisible
         sur fond clair. Une règle globale plutôt que 450 retouches : elle
         s'applique à TOUTES les zones de texte, sur fond clair comme sur fond
         sombre, parce que la couleur dérive de la couleur du texte
         (`currentColor` à 55 %, soit ~3:1 sur blanc) — grise sur un champ
         clair, claire sur un champ sombre. Épaisseur 2 px et non 1,5 px :
         mesuré en navigateur, 1,5 px s'arrondit à 1 px sur un écran de
         densité 1 (la plupart des ordinateurs), donc n'épaissit rien. Rien
         d'autre n'est touché : rayons, fonds, anneaux de focus (`ring-*`,
         en box-shadow) restent ceux du composant.
         SPÉCIFICITÉ PLUTÔT QUE L'ORDRE (même principe que la couche aqua) :
         les deux `:not(.classe)` portent chaque sélecteur à (0,3,1), au-dessus
         des utilitaires Tailwind (0,1,0), de leurs variantes `focus:` et de la
         couche aqua `[data-miroir] .x` (0,2,0), quel que soit l'ordre
         d'injection. Ces deux classes sont aussi la porte de sortie : un champ
         portant `saisie-sans-contour` ou `saisie-contour-libre` garde son
         style propre. Sélecteurs courts, un par type de champ texte, pour
         rester sous la garde des 200 caractères de
         tests/miroirFeuilleAnalysee.test.ts. Exclus par construction : cases,
         boutons radio, curseurs, fichiers, couleurs, boutons — aucun n'est
         une zone où l'on écrit.
         =================================================================== */
      input[type="text"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="email"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="password"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="search"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="number"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="tel"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input[type="url"]:not(.saisie-sans-contour):not(.saisie-contour-libre),
      input:not([type]):not(.saisie-sans-contour):not(.saisie-contour-libre),
      textarea:not(.saisie-sans-contour):not(.saisie-contour-libre),
      [contenteditable="true"]:not(.saisie-sans-contour):not(.saisie-contour-libre) {
        border-width: 2px;
        border-style: solid;
        border-color: rgba(100, 116, 139, 0.85); /* repli : slate-500 */
        border-color: color-mix(in srgb, currentColor 55%, transparent);
      }
      /* Au focus : le contour prend l'accent aqua de la marque (aqua-600 de la
         couche générée), lisible sur clair comme sur sombre ; l'anneau
         `focus:ring-*` du composant, en box-shadow, reste intact. */
      input[type="text"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="email"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="password"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="search"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="number"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="tel"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input[type="url"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      input:not([type]):not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      textarea:not(.saisie-sans-contour):not(.saisie-contour-libre):focus,
      [contenteditable="true"]:not(.saisie-sans-contour):not(.saisie-contour-libre):focus {
        border-color: #0e7490;
      }
      /* ===== FIN ZONES DE SAISIE ===== */

      /* ===================================================================
         EXPERTS — PLATEAUX DE CRISTAL (DEC-2026-056)

         Direction D choisie par la Direction : une phrase, puis chaque
         expert dans une bulle de cristal posée sur une lame de verre, en
         lumière du jour et dans les couleurs du menu « Miroir d'eau ».
         Le mouvement (flottement, halo, lumière tournante, inclinaison au
         survol) est entièrement CSS et s'arrête sous
         prefers-reduced-motion. Les sélecteurs restent courts et sans
         accent (garde-fou tests/miroirFeuilleAnalysee).
         =================================================================== */
      .cristal-panneau {
        --cr-encre: var(--mir-ink, #0B3A46);
        --cr-encre-2: #3E6A76;
        --cr-acc: var(--mir-acc, #0F9EC2);
        --cr-lum: var(--water-accent, #7DD3FC);
        --cr-vivant: var(--mir-pros, #12A579);
        position: relative;
        isolation: isolate;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        background:
          radial-gradient(60% 40% at 20% 0%, rgba(255,255,255,.75), transparent 70%),
          radial-gradient(50% 50% at 90% 100%, rgba(125,211,252,.28), transparent 70%),
          var(--mir-bg, #EAF7FB);
      }
      .cristal-phrase {
        text-align: center;
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 500;
        font-size: clamp(16px, 1.9vw, 21px);
        line-height: 1.35;
        color: var(--cr-encre);
        max-width: 62ch;
        margin: 30px auto 8px;
        padding: 0 24px;
        text-wrap: balance;
      }
      .cristal-scene {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        list-style: none;
        margin: 0;
        padding: 34px 22px 64px;
        gap: 34px 0;
      }
      .cristal-expert {
        flex: 0 0 20%;
        max-width: 20%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }
      .cristal-expert:nth-child(2n) { transform: translateY(22px); }
      /* le bouton porte toute la colonne : cliquer le nom ouvre aussi la fiche */
      .cristal-expert-bouton {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 0;
        padding: 0 0 4px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: center;
        cursor: pointer;
        border-radius: 24px;
        -webkit-tap-highlight-color: transparent;
      }
      .cristal-expert-bouton:focus-visible { outline: 3px solid var(--cr-acc); outline-offset: 4px; }
      .cristal-plateau {
        position: relative;
        width: 100%;
        max-width: 200px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        perspective: 700px;
      }
      /* la lame de verre aux bords irreguliers */
      .cristal-plateau::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        height: 76px;
        border-radius: 52% 48% 46% 54% / 64% 70% 30% 36%;
        background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(221,241,248,.55));
        box-shadow:
          inset 0 0 0 1.5px rgba(255,255,255,.95),
          inset 0 -10px 18px rgba(15,158,194,.14),
          0 16px 30px rgba(11,58,70,.14);
        transform: rotate(-4deg);
        transition: box-shadow .35s, transform .35s;
      }
      /* le filet de lumiere aqua qui pulse sous le portrait */
      .cristal-plateau::after {
        content: "";
        position: absolute;
        left: 14%;
        right: 14%;
        bottom: 18px;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--cr-lum), transparent);
        opacity: .9;
        animation: cristal-halo var(--th, 6s) ease-in-out var(--dh, 0s) infinite;
      }
      .cristal-expert-bouton:focus-visible .cristal-plateau::before {
        box-shadow:
          inset 0 0 0 1.5px rgba(255,255,255,1),
          inset 0 -10px 18px rgba(15,158,194,.20),
          0 22px 40px rgba(11,58,70,.18),
          0 0 0 4px rgba(125,211,252,.22);
        transform: rotate(-4deg) translateY(2px);
      }
      .cristal-reflet {
        position: absolute;
        left: 50%;
        bottom: 10px;
        width: 70px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(15,158,194,.30), rgba(15,158,194,0) 70%);
        filter: blur(1px);
        pointer-events: none;
      }
      /* le flotteur porte le flottement ; la bulle porte le survol et l'inclinaison :
         deux couches pour que les deux transformations ne se disputent jamais */
      .cristal-flotteur {
        position: relative;
        z-index: 1;
        display: block;
        animation: cristal-flotte var(--tf, 7s) ease-in-out var(--df, 0s) infinite;
        will-change: transform;
      }
      .cristal-bulle {
        --d: 112px;
        position: relative;
        display: block;
        width: var(--d);
        height: var(--d);
        border-radius: 50%;
        flex: none;
        overflow: hidden;
        background:
          radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0, rgba(255,255,255,.55) 14%, rgba(255,255,255,0) 40%),
          radial-gradient(circle at 70% 80%, rgba(125,211,252,.55), rgba(125,211,252,0) 55%),
          linear-gradient(160deg, rgba(255,255,255,.75), rgba(221,241,248,.55));
        box-shadow:
          inset 0 0 0 1.5px rgba(255,255,255,.95),
          inset 0 -14px 24px rgba(15,158,194,.18),
          inset 0 10px 18px rgba(255,255,255,.7),
          0 14px 30px rgba(11,58,70,.16),
          0 0 0 6px rgba(255,255,255,.35);
        transform-style: preserve-3d;
        transform: translateY(var(--lift, 0px)) scale(var(--sc, 1)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
      }
      .cristal-bulle img {
        position: absolute;
        inset: 10%;
        width: 80%;
        height: 80%;
        border-radius: 50%;
        object-fit: cover;
        filter: saturate(.92) contrast(1.02);
        transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.02);
        transition: transform .35s cubic-bezier(.2,.7,.2,1);
        background: #DDF1F8;
      }
      /* voile de verre par-dessus le portrait */
      .cristal-bulle::before {
        content: "";
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
          linear-gradient(180deg, rgba(255,255,255,.08), rgba(15,158,194,.14));
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
        pointer-events: none;
      }
      /* le reflet arque, signature cristal */
      .cristal-bulle::after {
        content: "";
        position: absolute;
        left: 18%;
        top: 9%;
        width: 38%;
        height: 22%;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0));
        filter: blur(.6px);
        transform: rotate(-18deg);
        pointer-events: none;
      }
      /* la lumiere qui tourne lentement sur le bord de la bulle */
      .cristal-lumiere {
        position: absolute;
        inset: -2%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 58%, rgba(255,255,255,.85) 66%, rgba(125,211,252,.55) 71%, transparent 78%);
        -webkit-mask: radial-gradient(circle, transparent 60%, #000 67%, #000 100%);
        mask: radial-gradient(circle, transparent 60%, #000 67%, #000 100%);
        opacity: .75;
        animation: cristal-tourne 12s linear infinite;
        pointer-events: none;
      }
      /* la pastille vit dans le flotteur, HORS du cercle de la bulle qui la rognait */
      .cristal-flotteur > .cristal-pastille {
        position: absolute;
        right: 5%;
        bottom: 7%;
        z-index: 2;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--cr-vivant);
        border: 2.5px solid #fff;
        box-shadow: 0 0 0 3px rgba(18,165,121,.28);
      }
      .cristal-pastille::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 3px solid rgba(18,165,121,.35);
        opacity: 0;
        pointer-events: none;
      }
      /* pouls sur le compositeur seulement : transform + opacity, jamais box-shadow */
      .cristal-pastille[data-etat="available"]::after { animation: cristal-pouls 2.6s ease-out infinite; }
      .cristal-pastille[data-etat="in_call"] { background: #F59E0B; box-shadow: 0 0 0 3px rgba(245,158,11,.28); }
      .cristal-pastille[data-etat="appointment_only"] { background: var(--cr-acc); box-shadow: 0 0 0 3px rgba(15,158,194,.28); }
      @media (hover: hover) and (pointer: fine) {
        .cristal-expert-bouton:hover .cristal-flotteur { animation-play-state: paused; }
        .cristal-expert-bouton:hover .cristal-plateau::before {
          box-shadow:
            inset 0 0 0 1.5px rgba(255,255,255,1),
            inset 0 -10px 18px rgba(15,158,194,.20),
            0 22px 40px rgba(11,58,70,.18),
            0 0 0 4px rgba(125,211,252,.22);
          transform: rotate(-4deg) translateY(2px);
        }
        .cristal-expert-bouton:hover .cristal-bulle {
          --lift: -6px;
          --sc: 1.045;
          box-shadow:
            inset 0 0 0 1.5px rgba(255,255,255,1),
            inset 0 -14px 24px rgba(15,158,194,.22),
            inset 0 10px 18px rgba(255,255,255,.75),
            0 22px 40px rgba(11,58,70,.20),
            0 0 0 8px rgba(125,211,252,.35);
        }
      }
      .cristal-expert-bouton:focus-visible .cristal-bulle {
        --lift: -6px;
        --sc: 1.045;
        box-shadow:
          inset 0 0 0 1.5px rgba(255,255,255,1),
          inset 0 -14px 24px rgba(15,158,194,.22),
          inset 0 10px 18px rgba(255,255,255,.75),
          0 22px 40px rgba(11,58,70,.20),
          0 0 0 8px rgba(125,211,252,.35);
      }
      .cristal-nom {
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 700;

        letter-spacing: .01em;
        line-height: 1.2;
      }
      .cristal-role {
        font-size: 11.5px;
        color: var(--cr-encre-2);
        margin-top: -6px;
        line-height: 1.25;
        padding: 0 6px;
      }

      /* la fiche : toutes les actions de l'ancienne carte, sur demande */
      .cristal-voile {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(11,58,70,.30);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        animation: cristal-apparait .2s ease-out;
      }
      .cristal-fiche {
        --cr-encre: var(--mir-ink, #0B3A46);
        --cr-encre-2: #3E6A76;
        --cr-acc: var(--mir-acc, #0F9EC2);
        --cr-lum: var(--water-accent, #7DD3FC);
