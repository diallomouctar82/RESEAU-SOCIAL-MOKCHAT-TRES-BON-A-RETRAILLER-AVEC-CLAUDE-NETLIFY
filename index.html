
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0
         sur iOS — le pb-[max(...,env(safe-area-inset-bottom))] du dock mobile
         (Layout.tsx) était donc sans effet sur les iPhone à encoche. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Le Monde à Vous</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              display: ['Outfit', '"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              navy: {
                950: '#070D1E',
                900: '#0B132B',
                800: '#14213D',
                700: '#1E293B',
                600: '#334155',
              },
              accent: {
                DEFAULT: '#EA580C',
                hover: '#C2410C',
                light: '#FFF7ED',
                border: '#FED7AA',
                subtle: '#FB923C',
              },
              // Échelle complétée le 30 août 2026 : 200/300/400/800/950
                // manquaient alors que ~150 occurrences les utilisaient déjà
                // (bg-brand-400, text-brand-300...) à travers Boutique, Wallet,
                // Paramètres, Layout et Commerce. Tailwind ignore silencieusement
                // une teinte non définie — ces classes ne peignaient donc
                // strictement RIEN, sans erreur ni avertissement. Les teintes
                // 200-800 suivent l'échelle bleue standard déjà adoptée par
                // 50/100/500/600/700 ; 900/950 conservent la dérive volontaire
                // vers le navy institutionnel.
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb', // Primary Blue
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#0B132B', // Institutional Deep Navy
                950: '#050A15', // Navy le plus profond (fonds pleine page)
              },
              // Système verre/eau/lumière du LIVE (LOOP 07/14, univers n°9
              // Glassmorphism Crystal Water — prompts 1/7 et 3/7). Teintes du
              // "corps" du verre/de l'eau, distinctes du slate/indigo générique
              // utilisé partout ailleurs dans l'app pour bien signaler que le
              // LIVE a sa propre matière visuelle.
              crystal: {
                deep: '#040B14',    // fond derrière le verre, jamais du noir pur
                glass: '#0C1B2E',   // corps du verre au repos
                water: '#0E293D',   // teinte de l'eau en mouvement
                highlight: '#8FE3FF', // reflet/lumière sur le verre
                foam: '#E8FBFF',    // microbulles/écume, très clair
              },
            },
            keyframes: {
              // Repos : quasi immobile, respiration à peine perceptible.
              'water-idle': {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.9' },
                '50%': { transform: 'scale(1.004)', opacity: '1' },
              },
              // Interaction : légère ondulation à la surface.
              'water-ripple': {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-1px) scale(1.006)' },
              },
              // Commande vocale : onde lumineuse qui traverse le verre.
              'water-wave': {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              // Réflexion (l'IA réfléchit) : mouvements internes subtils, plus lents que l'ondulation.
              'water-reflect': {
                '0%, 100%': { transform: 'translateY(0)' },
                '33%': { transform: 'translateY(-0.5px)' },
                '66%': { transform: 'translateY(0.5px)' },
              },
              // Succès : impulsion positive, brève et nette.
              'water-success': {
                '0%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(143,227,255,0.5)' },
                '40%': { transform: 'scale(1.03)', boxShadow: '0 0 0 8px rgba(143,227,255,0)' },
                '100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(143,227,255,0)' },
              },
              // Erreur : variation discrète, jamais agressive (pas de secousse violente).
              'water-error': {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-1.5px)' },
                '75%': { transform: 'translateX(1.5px)' },
              },
              // Direction artistique Studio Live (image de référence du
              // 30/08/2026) — la matière vivante : l'interface « respire »,
              // sans mouvement brusque ni rupture visuelle.
              // Respiration du verre : très lente, presque imperceptible.
              'water-breathe': {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.0035)', filter: 'brightness(1.03)' },
              },
              // Ondulation de surface : dérive verticale infime — fonctionne
              // sur n'importe quel élément (un background-position n'aurait
              // d'effet que si background-size > 100%, ce qui n'est pas le
              // cas des surfaces de verre).
              'water-undulate': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-0.7px)' },
              },
              // (droplet-float et water-press vivent dans le bloc <style>
              // ci-dessous : ils ne sont consommés que par les classes
              // pleines .water-droplets/.water-ripple-dot — une seule source
              // de vérité, jamais deux définitions du même keyframe.)
              // Grammaire d'états de l'avatar (LOOP 10/14) — 4 états propres
              // à l'avatar, en plus des 6 réutilisés du LOOP 07/14 ci-dessus.
              // Vision active : double impulsion lumineuse (balayage/attention visuelle).
              'avatar-vision': {
                '0%, 100%': { boxShadow: '0 0 16px 2px var(--halo-color)', opacity: '0.85' },
                '25%, 75%': { boxShadow: '0 0 28px 6px var(--halo-color)', opacity: '1' },
              },
              // Compréhension : micro-mouvement ascendant, comme des bulles qui remontent.
              'avatar-comprehension': {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-2px) scale(1.015)' },
              },
              // Action : impulsion décisive et brève, jamais en boucle.
              'avatar-action': {
                '0%': { transform: 'scale(1) rotate(0deg)' },
                '30%': { transform: 'scale(1.06) rotate(-1deg)' },
                '60%': { transform: 'scale(1.02) rotate(0.5deg)' },
                '100%': { transform: 'scale(1) rotate(0deg)' },
              },
              // Incertitude : balancement lent et discret, jamais présenté comme une erreur ni une certitude.
              'avatar-uncertainty': {
                '0%, 100%': { transform: 'translateX(0)', opacity: '0.75' },
                '50%': { transform: 'translateX(3px)', opacity: '0.55' },
              },
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(10px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              'scale-in': {
                '0%': { transform: 'scale(0)' },
                '60%': { transform: 'scale(1.05)' },
                '100%': { transform: 'scale(1)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'breathe': {
                '0%, 100%': { transform: 'scale(1.15) translateY(0)' },
                '50%': { transform: 'scale(1.17) translateY(-2px)' },
              },
              'breathe-fast': {
                '0%, 100%': { transform: 'scale(1.15) translateY(0)' },
                '50%': { transform: 'scale(1.16) translateY(-1px)' },
              },
              'shimmer': {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' }
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.7' },
              },
              'float-up': {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                '100%': { transform: 'translateY(-200px) scale(1.5)', opacity: '0' }
              },
              'fall': {
                '0%': { transform: 'translateY(-100vh) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(100vh) rotate(360deg)', opacity: '0' }
              },
              'slide-across': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100vw)' }
              },
              'pop-in': {
                '0%': { transform: 'scale(0) rotate(-45deg)', opacity: '0' },
                '60%': { transform: 'scale(1.2) rotate(10deg)', opacity: '1' },
                '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' }
              },
              'scan-vertical': {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' }
              }
            },
            animation: {
              'fade-up': 'fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'scale-in': 'scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'breathe': 'breathe 6s ease-in-out infinite',
              'breathe-fast': 'breathe-fast 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'pulse-soft': 'pulse-soft 3s infinite',
              'float-up': 'float-up 2s ease-out forwards',
              'fall': 'fall 3s linear forwards',
              'slide-across': 'slide-across 5s linear forwards',
              'pop-in': 'pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'scan-vertical': 'scan-vertical 2s linear infinite',
              'water-idle': 'water-idle 6s ease-in-out infinite',
              'water-ripple': 'water-ripple 1.6s ease-in-out infinite',
              'water-wave': 'water-wave 1.8s linear infinite',
              'water-reflect': 'water-reflect 2.4s ease-in-out infinite',
              'water-success': 'water-success 0.6s ease-out forwards',
              'water-error': 'water-error 0.4s ease-in-out',
              'avatar-vision': 'avatar-vision 1s ease-in-out infinite',
              'avatar-comprehension': 'avatar-comprehension 1.2s ease-in-out infinite',
              'avatar-action': 'avatar-action 0.5s ease-out',
              'avatar-uncertainty': 'avatar-uncertainty 2.2s ease-in-out infinite',
              'water-breathe': 'water-breathe 9s ease-in-out infinite',
              'water-undulate': 'water-undulate 11s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      /* Utilitaires scrollbar — ~30 composants utilisent .no-scrollbar /
         .scrollbar-none / .scrollbar-thin (onglets Experts, filtres
         Catalogue, Campus, Layout…) alors qu'AUCUNE de ces classes n'était
         définie (Tailwind CDN ne les fournit pas) : les barres système
         pleines s'affichaient, ou rien ne signalait le débordement. */
      .no-scrollbar,
      .scrollbar-none {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar,
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-thin {
        scrollbar-width: thin;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .glass-dark {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .perspective-container {
        perspective: 1000px;
        transform-style: preserve-3d;
      }
      /* Système verre/eau/lumière (LOOP 07/14) — le verre est une matière
         (épaisseur perçue, reflet, profondeur), pas un effet CSS générique
         plaqué partout : bordure claire en haut (lumière qui vient d'en
         haut), légère dégradation vers le bas (profondeur du liquide),
         netteté du contenu jamais compromise (le flou reste sur le fond,
         jamais sur le texte au premier plan — prompt 3/7).

         Cinq univers visuels (LOOP 08/14) : les teintes sont des variables
         CSS avec la valeur "crystal" par défaut sur :root — [data-live-
         universe] (posé sur le conteneur racine du LIVE) les redéfinit pour
         les 4 univers secondaires. Toujours les 2 mêmes classes, jamais une
         famille de classes par univers — une architecture, pas 5 refontes. */
      :root {
        --glass-tint-a: rgba(15, 41, 61, 0.72);
        --glass-tint-b: rgba(4, 11, 20, 0.85);
        --glass-border: rgba(143, 227, 255, 0.18);
        --glass-border-top: rgba(232, 251, 255, 0.35);
        --glass-shadow-inset: rgba(232, 251, 255, 0.12);
        --glass-surface-tint-a: rgba(14, 41, 61, 0.55);
        --glass-surface-tint-b: rgba(12, 27, 46, 0.65);
        --glass-surface-border: rgba(143, 227, 255, 0.14);
        /* Couleur signature de l'univers (direction artistique Studio Live,
           image de référence du 30/08/2026) : l'anneau/la lueur qui identifie
           chaque univers. Consommée par l'onde d'appui, les micro-gouttelettes
           et les accents — jamais une couleur codée en dur par composant. */
        --water-accent: #7dd3fc;
        --water-accent-soft: rgba(125, 211, 252, 0.35);
      }
      /* Palette recalée sur l'image de référence de la direction artistique
         du Studio Live (30/08/2026) : chaque univers reçoit sa couleur
         signature (--water-accent, l'anneau lumineux de l'image) et des
         teintes de verre fidèles aux 7 modèles fournis. */
      /* 1 — Futuriste Bleu : bleu électrique sur nuit profonde. */
      [data-live-universe="futuristic_blue"] {
        --glass-tint-a: rgba(10, 32, 84, 0.75);
        --glass-tint-b: rgba(3, 8, 28, 0.88);
        --glass-border: rgba(80, 165, 255, 0.24);
        --glass-border-top: rgba(170, 216, 255, 0.42);
        --glass-shadow-inset: rgba(170, 216, 255, 0.14);
        --glass-surface-tint-a: rgba(10, 32, 84, 0.55);
        --glass-surface-tint-b: rgba(6, 16, 48, 0.68);
        --glass-surface-border: rgba(80, 165, 255, 0.17);
        --water-accent: #38bdf8;
        --water-accent-soft: rgba(56, 189, 248, 0.35);
      }
      /* 2 — Naturel & Frais : vert vivant, verre plus clair et végétal. */
      [data-live-universe="natural_fresh"] {
        --glass-tint-a: rgba(22, 62, 46, 0.66);
        --glass-tint-b: rgba(8, 26, 19, 0.82);
        --glass-border: rgba(120, 235, 170, 0.22);
        --glass-border-top: rgba(224, 255, 238, 0.38);
        --glass-shadow-inset: rgba(224, 255, 238, 0.13);
        --glass-surface-tint-a: rgba(22, 62, 46, 0.48);
        --glass-surface-tint-b: rgba(12, 36, 27, 0.6);
        --glass-surface-border: rgba(120, 235, 170, 0.15);
        --water-accent: #4ade80;
        --water-accent-soft: rgba(74, 222, 128, 0.32);
      }
      /* 4 — Solaire & Chaud : ambre doré, chaleur de fin de journée. */
      [data-live-universe="solaire_chaud"] {
        --glass-tint-a: rgba(70, 38, 8, 0.72);
        --glass-tint-b: rgba(24, 11, 3, 0.88);
        --glass-border: rgba(251, 176, 64, 0.26);
        --glass-border-top: rgba(255, 220, 160, 0.42);
        --glass-shadow-inset: rgba(255, 220, 160, 0.14);
        --glass-surface-tint-a: rgba(70, 38, 8, 0.52);
        --glass-surface-tint-b: rgba(40, 21, 6, 0.64);
        --glass-surface-border: rgba(251, 176, 64, 0.18);
        --water-accent: #f59e0b;
        --water-accent-soft: rgba(245, 158, 11, 0.33);
      }
      /* 5 — Violet Luxe : violet profond, reflet doré (sensation premium). */
      [data-live-universe="violet_luxe"] {
        --glass-tint-a: rgba(48, 18, 66, 0.74);
        --glass-tint-b: rgba(15, 5, 24, 0.87);
        --glass-border: rgba(202, 145, 255, 0.22);
        --glass-border-top: rgba(255, 222, 170, 0.36);
        --glass-shadow-inset: rgba(255, 222, 170, 0.12);
        --glass-surface-tint-a: rgba(48, 18, 66, 0.52);
        --glass-surface-tint-b: rgba(30, 11, 44, 0.64);
        --glass-surface-border: rgba(202, 145, 255, 0.17);
        --water-accent: #c084fc;
        --water-accent-soft: rgba(192, 132, 252, 0.34);
      }
      /* 6 — Océan Profond : bleu-sarcelle sombre, profondeur marine calme. */
      [data-live-universe="deep_ocean"] {
        --glass-tint-a: rgba(6, 38, 48, 0.78);
        --glass-tint-b: rgba(2, 11, 15, 0.9);
        --glass-border: rgba(64, 205, 216, 0.2);
        --glass-border-top: rgba(158, 242, 242, 0.32);
        --glass-shadow-inset: rgba(158, 242, 242, 0.1);
        --glass-surface-tint-a: rgba(6, 38, 48, 0.56);
        --glass-surface-tint-b: rgba(4, 22, 28, 0.68);
        --glass-surface-border: rgba(64, 205, 216, 0.15);
        --water-accent: #2dd4bf;
        --water-accent-soft: rgba(45, 212, 191, 0.33);
      }
      /* 7 — Rose Doux : rose poudré, douceur et légèreté (verre le plus clair). */
      [data-live-universe="rose_doux"] {
        --glass-tint-a: rgba(88, 36, 58, 0.6);
        --glass-tint-b: rgba(38, 14, 26, 0.8);
        --glass-border: rgba(249, 168, 212, 0.28);
        --glass-border-top: rgba(255, 226, 240, 0.44);
        --glass-shadow-inset: rgba(255, 226, 240, 0.16);
        --glass-surface-tint-a: rgba(88, 36, 58, 0.44);
        --glass-surface-tint-b: rgba(56, 22, 38, 0.58);
        --glass-surface-border: rgba(249, 168, 212, 0.2);
        --water-accent: #f472b6;
        --water-accent-soft: rgba(244, 114, 182, 0.32);
      }
      .glass-crystal {
        background: linear-gradient(180deg, var(--glass-tint-a) 0%, var(--glass-tint-b) 100%);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-top-color: var(--glass-border-top);
        box-shadow: inset 0 1px 0 0 var(--glass-shadow-inset), 0 8px 32px -8px rgba(4, 11, 20, 0.6);
      }
      .glass-crystal-surface {
        background: linear-gradient(180deg, var(--glass-surface-tint-a) 0%, var(--glass-surface-tint-b) 100%);
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        border: 1px solid var(--glass-surface-border);
      }
      /* Halo de l'avatar (LOOP 10/14) — l'avatar est intégré au système
         verre/eau/lumière (couleur portée par --halo-color, posée par
         avatarHaloProps()), pas un élément visuel isolé posé par-dessus.
         inset:0 + ombre INTÉRIEURE (jamais une valeur négative type -6px) :
         les tuiles avatar du LIVE sont systématiquement dans un conteneur
         overflow-hidden (rounded-3xl) — un halo qui déborderait serait
         invisible, tronqué par cet ancêtre. */
      .avatar-halo {
        position: absolute;
        inset: 0;
        /* Valeur fixe (pas "inherit", qui remonterait au conteneur direct
           d'Avatar3D — non arrondi — et non à la tuile rounded-3xl du LIVE
           qui l'englobe) : les tuiles avatar du LIVE utilisent toutes
           rounded-3xl (1.5rem) par convention dans ce dépôt. */
        border-radius: 1.5rem;
        border: 2px solid var(--halo-color, rgba(232, 251, 255, 0.3));
        box-shadow: inset 0 0 28px 4px var(--halo-color, rgba(232, 251, 255, 0.2));
        pointer-events: none;
        z-index: 5;
        transition: border-color 0.4s ease, box-shadow 0.4s ease;
      }
      /* Direction artistique Studio Live (30/08/2026) — la matière vivante.
         Onde d'appui : goutte qui touche une surface d'eau calme. Créée par
         spawnWaterRipple() (services/live/liveMaterialSystem.ts) aux
         coordonnées exactes de l'appui, teintée par l'univers courant via
         --water-accent-soft, retirée du DOM à la fin de l'animation. */
      @keyframes water-press {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0.55; }
        100% { transform: translate(-50%, -50%) scale(14); opacity: 0; }
      }
      .water-ripple-dot {
        position: absolute;
        width: 24px;
        height: 24px;
        border-radius: 9999px;
        background: radial-gradient(circle, var(--water-accent-soft) 0%, transparent 70%);
        border: 1px solid var(--water-accent-soft);
        pointer-events: none;
        z-index: 40;
        animation: water-press 0.65s ease-out forwards;
      }
      /* Micro-gouttelettes lumineuses : trois points de lumière discrets qui
         dérivent très lentement — des reflets, jamais un motif décoratif
         chargé. Superposition passive (pointer-events none), à poser sur les
         grandes surfaces de verre uniquement. */
      @keyframes droplet-float {
        0%, 100% { background-position: 0 0, 40px 60px, 90px 20px; opacity: 0.5; }
        50% { background-position: 2px -8px, 38px 50px, 92px 10px; opacity: 0.8; }
      }
      .water-droplets {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background-image:
          radial-gradient(2px 2px at 12% 30%, var(--water-accent-soft), transparent),
          radial-gradient(1.5px 1.5px at 60% 70%, var(--water-accent-soft), transparent),
          radial-gradient(1px 1px at 85% 15%, var(--water-accent-soft), transparent);
        background-repeat: no-repeat;
        animation: droplet-float 14s ease-in-out infinite;
      }
      /* L'interface respire — mais jamais contre la volonté de l'utilisateur :
         toute animation décorative de la matière est désactivée quand le
         système demande une réduction du mouvement. Les animations d'ÉTAT
         (succès/erreur) portent du sens et ne sont pas concernées. */
      @media (prefers-reduced-motion: reduce) {
