        position: relative;
        width: 100%;
        max-width: 540px;
        max-height: calc(100vh - 32px);
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        border-radius: 28px;
        padding: 26px 24px 22px;
        color: var(--cr-encre);
        background: linear-gradient(160deg, rgba(255,255,255,.94), rgba(234,247,251,.90));
        border: 1.5px solid rgba(255,255,255,.95);
        box-shadow: 0 30px 60px rgba(11,58,70,.22), inset 0 0 0 1px rgba(255,255,255,.6);
        animation: cristal-surgit .32s cubic-bezier(.2,.7,.2,1);
        outline: none;
      }
      .cristal-fermer {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(11,58,70,.12);
        border-radius: 50%;
        background: rgba(255,255,255,.8);
        color: var(--cr-encre-2);
        cursor: pointer;
      }
      .cristal-fermer:hover { color: var(--cr-encre); background: #fff; }
      .cristal-fiche-tete { display: flex; align-items: center; gap: 18px; padding-right: 40px; }
      .cristal-bulle-fiche { --d: 116px; flex: none; }
      .cristal-fiche-nom {
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 20px;
        line-height: 1.15;
        color: var(--cr-encre);
        margin: 0;
      }
      .cristal-fiche-titre { margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--cr-acc); }
      .cristal-fiche-specialite { margin: 2px 0 0; font-size: 12px; color: var(--cr-encre-2); }
      .cristal-fiche-etat {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0 0;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--cr-encre-2);
      }
      .cristal-fiche-texte { margin: 16px 0 0; font-size: 13px; line-height: 1.55; color: var(--cr-encre); }
      .cristal-fiche-langues { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 0; color: var(--cr-encre-2); }
      .cristal-fiche-langues span {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(255,255,255,.7);

      .cristal-fiche-dossier {

        align-items: center;
        gap: 8px;
        margin: 12px 0 0;
        padding: 9px 12px;
        border-radius: 14px;

      .cristal-fiche-progres { margin-left: auto; font-weight: 800; }
      .cristal-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
      .cristal-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 8px;
        border-radius: 14px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--cr-encre);
        background: rgba(255,255,255,.85);
        border: 1.5px solid rgba(11,58,70,.14);
        cursor: pointer;
        transition: transform .2s, box-shadow .2s, background .2s;
      }
      .cristal-action:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 8px 18px rgba(11,58,70,.12); }
      .cristal-action:focus-visible { outline: 3px solid var(--cr-acc); outline-offset: 2px; }
      .cristal-action-principale { color: #fff; background: var(--cr-acc); border-color: transparent; }
      .cristal-action-principale:hover { background: #0E7490; }
      .cristal-action-rdv { color: #fff; background: #D97706; border-color: transparent; }
      .cristal-action-rdv:hover { background: #B45309; }
      .cristal-actions .cristal-action:nth-child(4) { grid-column: 1 / span 2; }

      @keyframes cristal-flotte { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes cristal-halo { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
      @keyframes cristal-tourne { to { transform: rotate(360deg); } }
      @keyframes cristal-pouls { 0% { transform: scale(.8); opacity: .9; } 70%, 100% { transform: scale(1.9); opacity: 0; } }
      @keyframes cristal-apparait { from { opacity: 0; } to { opacity: 1; } }
      @keyframes cristal-surgit { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }

      @media (max-width: 1023px) {
        .cristal-expert { flex-basis: 33.333%; max-width: 33.333%; }
      }
      @media (max-width: 639px) {
        .cristal-scene { padding: 24px 10px 48px; gap: 26px 0; }
        .cristal-expert { flex-basis: 50%; max-width: 50%; }
        .cristal-expert:nth-child(2n) { transform: translateY(18px); }
        .cristal-plateau { height: 138px; }
        .cristal-bulle { --d: 100px; }
        .cristal-fiche { padding: 22px 18px 18px; border-radius: 22px; }
        .cristal-fiche-tete { gap: 14px; }
        .cristal-bulle-fiche { --d: 92px; }
        .cristal-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cristal-actions .cristal-action:nth-child(4) { grid-column: auto; }
        .cristal-actions .cristal-action:nth-child(5) { grid-column: 1 / -1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cristal-flotteur,
        .cristal-plateau::after,
        .cristal-pastille::after,
        .cristal-lumiere,
        .cristal-voile,
        .cristal-fiche { animation: none !important; }

        .cristal-bulle img,

        .cristal-action { transition: none; }

      /* ===== FIN PLATEAUX DE CRISTAL ===== */

      /* ===================================================================
         RESEAU MOC — BANDE AURORE (DEC-2026-058)

         Variante 3 « Aurore » choisie par la Direction parmi dix, sur la
         base « Orbes lumineux » : seize orbes de cristal, une teinte par
         entree (--h, en degres, posee par le composant), en damier sur deux
         rangees de huit ; l'orbe de la section courante se remplit de sa
         teinte. Halo qui respire, soulevement et lueur au survol (vrais
         pointeurs seulement), rail aimante sur telephone. Le bloc lit la
         largeur reelle de la carte (container query), pas celle de l'ecran.
         Tout s'arrete sous prefers-reduced-motion. Selecteurs courts et
         sans accent (garde-fou tests/miroirFeuilleAnalysee).
         =================================================================== */
      .aurore-bande {
        --au-encre: var(--mir-ink, #0B3A46);
        --au-acc: var(--mir-acc, #0F9EC2);
        container-type: inline-size;
        container-name: aurore;
        padding: 10px 12px 8px;
      }
      /* Retour au fil : un petit bouton au-dessus de la liste, HORS de la
         grille — les seize orbes restent seize, le damier ne bouge pas.
         Rendu seulement quand on a quitte le fil. */
      .aurore-retour {
        position: relative;
        vertical-align: top;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 2px 0 0 2px;
        padding: 8px 14px 8px 10px;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: rgba(255,255,255,.72);
        color: var(--au-encre);
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(11,58,70,.10), inset 0 0 0 1px rgba(255,255,255,.9);
        -webkit-tap-highlight-color: transparent;
      }
      .aurore-retour:focus-visible { outline: 3px solid var(--au-acc); outline-offset: 2px; box-shadow: 0 0 0 2px #fff; }
      .aurore-rangee {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 16px 6px;
        margin: 0;
        padding: 8px 0 4px;
        list-style: none;
      }
      .aurore-item {
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .aurore-orbe {
        --au-halo: hsl(var(--h, 196) 90% 72% / .55);
        --au-reflet: hsl(var(--h, 196) 70% 55% / .35);
        --au-anneau: hsl(var(--h, 196) 90% 70% / .4);
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        margin: 0;
        padding: 8px 2px 6px;
        border: 0;
        background: none;
        font: inherit;
        color: var(--au-encre);
        cursor: pointer;
        border-radius: 16px;
        -webkit-tap-highlight-color: transparent;
        flex: none;
        max-width: 100%;
      }
      .aurore-item:nth-child(2n) .aurore-orbe { transform: translateY(10px); }
      .aurore-orbe:focus-visible { outline: 3px solid var(--au-acc); outline-offset: 2px; box-shadow: 0 0 0 2px #fff; }
      .aurore-bulle {
        position: relative;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        color: hsl(var(--h, 196) 55% 30%);
        background:
          radial-gradient(circle at 32% 26%, rgba(255,255,255,1) 0, rgba(255,255,255,.55) 18%, rgba(255,255,255,0) 48%),
          radial-gradient(circle at 70% 82%, hsl(var(--h, 196) 85% 78% / .8), transparent 60%),
          linear-gradient(160deg, #fff, hsl(var(--h, 196) 80% 93%));
        box-shadow:
          inset 0 0 0 1.5px rgba(255,255,255,.95),
          inset 0 -12px 20px hsl(var(--h, 196) 70% 60% / .25),
          0 12px 26px rgba(11,58,70,.14),
          0 0 0 5px rgba(255,255,255,.35);
        transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, background .35s, color .35s;
      }
      /* reflet de lumiere en haut a gauche */
      .aurore-bulle::after {
        content: "";
        position: absolute;
        left: 18%;
        top: 9%;
        width: 38%;
        height: 22%;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0));
        transform: rotate(-18deg);
        pointer-events: none;
      }
      /* halo teinte qui respire, derriere l'orbe. Il est porte par le
         bouton et non par la bulle : une bulle transformee (survol, appui,
         transition) devient son propre contexte d'empilement et ferait
         passer un pseudo-element z-index -1 DEVANT son fond de verre. */
      .aurore-orbe::before {
        content: "";
        position: absolute;
        top: 1px;
        left: calc(50% - 34px);
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--au-halo), transparent 70%);
        z-index: -1;
        pointer-events: none;
        animation: aurore-halo var(--t, 5s) ease-in-out calc(var(--i, 0) * -.6s) infinite;
        transition: transform .35s, opacity .35s;
      }
      .aurore-bulle svg {
        position: relative;
        z-index: 1;
        transition: transform .3s, filter .3s;
      }
      /* orbe de la section courante : remplie de sa teinte, icone blanche.
         Clartes 38 % -> 28 %, sans reflet radial (seul le petit reflet
         ::after reste, attenue) : l'icone tient 3:1 au moins sous toute sa
         surface, meme sur les teintes claires (vert 158 : 3,4 ; aqua 196 :
         4,6, mesure par le controle independant). */
      .aurore-orbe[aria-current="page"] .aurore-bulle {
        color: #fff;
        background: linear-gradient(160deg, hsl(var(--h, 196) 70% 38%), hsl(var(--h, 196) 65% 28%));
      }
      .aurore-orbe[aria-current="page"] .aurore-bulle::after { opacity: .4; }

      /* ===================================================================
         DS-EX-2 · LA NAPPE D'EAU RÉELLEMENT VISIBLE DANS TOUTE L'APPLICATION

         Constat mesuré : `data-miroir` couvrait déjà tous les écrans, mais
         chacun repeint un fond pleine page opaque par-dessus la nappe — d'où
         l'impression que l'habillage s'arrête à l'accueil.

         La correction ne peut PAS être « rendre tout `bg-white` transparent » :
         les mêmes classes portent les champs de saisie, les listes déroulantes
         et les menus, où l'opacité sert la lisibilité. Elle vise donc
         exclusivement l'ENFANT DIRECT de `.mir-page`, c'est-à-dire la racine de
         l'écran courant et rien d'autre.

         `[class*=…]` couvre d'un coup les variantes d'opacité écrites dans le
         code (`bg-slate-50/60`, `bg-white/80`…) sans avoir à les énumérer.
         Spécificité (0,3,0) contre (0,1,0) pour l'utilitaire Tailwind : le
         résultat ne dépend pas de l'ordre d'injection du CDN.
         =================================================================== */
      [data-miroir] .mir-page > [class*="bg-white"],
      [data-miroir] .mir-page > [class*="bg-slate-50"],
      [data-miroir] .mir-page > [class*="bg-slate-100"],
      [data-miroir] .mir-page > [class*="bg-gray-50"] {
        background-color: transparent;
      }

      /* Les cartes de contenu prennent la « feuille de lecture » : 94 %, la même
         valeur que les publications du fil depuis DS-M2b. Un paragraphe ne se lit
         pas à travers de l'eau — la teinte et l'ombre disent la matière, sans
         jamais coûter en lisibilité. Le rayon 2xl/3xl distingue une CARTE d'un
         champ de saisie (rounded-xl et en dessous), qui reste intact.

         Périmètre `[data-miroir]` et NON `.mir-page` : les modales de
         navigation (services transversaux, Mon Cap, paramètres, Architecte)
         sont rendues par `Layout` À CÔTÉ de `<main>`, donc hors de
         `.mir-page`. Les y laisser aurait gardé des panneaux blancs francs au
         milieu d'une application en verre — précisément la rupture visible
         signalée par la Direction. */
      [data-miroir] .bg-white.rounded-3xl,
      [data-miroir] .bg-white.rounded-2xl {
        background-color: var(--mir-sheet);
        border-color: var(--mir-sheet-bd);
        box-shadow: var(--mir-sh-sm);
      }

      /* Les barres de section (en-tête d'un hub, pied d'un panneau) sont du
         chrome, pas de la lecture : elles prennent le verre à 44 % comme les
         en-têtes de l'application. */
      [data-miroir] .bg-white.border-b,
      [data-miroir] .bg-white.border-t {
        background-color: var(--mir-band);
        backdrop-filter: var(--mir-blur);
        -webkit-backdrop-filter: var(--mir-blur);
        border-color: var(--mir-band-bd);
      }

      @media (prefers-reduced-transparency: reduce) {
        [data-miroir] .mir-page > [class*="bg-white"],
        [data-miroir] .mir-page > [class*="bg-slate-50"],
        [data-miroir] .mir-page > [class*="bg-slate-100"],
        [data-miroir] .mir-page > [class*="bg-gray-50"],
        [data-miroir] .bg-white.rounded-3xl,
        [data-miroir] .bg-white.rounded-2xl,
        [data-miroir] .bg-white.border-b,
        [data-miroir] .bg-white.border-t {
          background-color: var(--mir-panel-solid);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }
