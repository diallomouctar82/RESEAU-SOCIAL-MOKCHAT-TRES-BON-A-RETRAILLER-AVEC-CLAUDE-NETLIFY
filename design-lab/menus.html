<title>Menus Vivants MokNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* ═════════ COQUILLE DE GALERIE ═════════ */
:root{--g:#F1F4F8;--s:#FFFFFF;--l:#E2E8F0;--t:#14202E;--m:#5B6B7D;--d:#8A98A8;--a:#0F9B6C;
 --disp:'Poppins',system-ui,sans-serif;--txt:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--t);font-family:var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:6px}
.lab{min-height:100vh;display:flex;flex-direction:column}
.lab>.bar{display:flex;align-items:center;gap:16px;padding:13px 20px;border-bottom:1px solid var(--l);
 background:var(--s);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.bar-id{font-family:var(--disp);font-weight:500;font-size:12.5px;letter-spacing:.22em;color:var(--d);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-name{font-family:var(--disp);font-weight:700;font-size:19px;white-space:nowrap}
.bar-p{color:var(--m);font-size:14px;line-height:1.45;flex:1;min-width:200px;max-width:62ch}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.step{width:38px;height:38px;border:1px solid var(--l);border-radius:10px;display:grid;place-items:center;background:var(--s);transition:.18s}
.step:hover{border-color:#B9C4D1}
.seg{display:flex;border:1px solid var(--l);border-radius:10px;overflow:hidden;background:var(--s)}
.seg button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--m);transition:.18s}
.seg button[aria-pressed=true]{background:rgba(15,155,108,.12);color:var(--a)}
.dots{display:flex;gap:5px}
.dot{width:31px;height:31px;border-radius:9px;border:1px solid var(--l);background:var(--s);font-size:12px;font-weight:700;color:var(--d);font-variant-numeric:tabular-nums;transition:.18s}
.dot[aria-current=true]{border-color:var(--a);color:var(--a);background:rgba(15,155,108,.12)}
.stage{flex:1;display:grid;place-items:center;padding:24px 20px 30px;overflow:auto}
.frame{position:relative;background:#fff;overflow:hidden}
.frame[data-device=desktop]{width:min(1180px,94vw);aspect-ratio:16/10;border-radius:14px;border:1px solid #D5DDE7;box-shadow:0 40px 90px -36px rgba(20,40,70,.45)}
.frame[data-device=mobile]{width:min(390px,92vw);aspect-ratio:390/812;border-radius:40px;border:9px solid #1A222D;box-shadow:0 40px 90px -30px rgba(20,40,70,.55)}
.app{position:absolute;inset:0;overflow:hidden;isolation:isolate}
.foot{padding:0 20px 24px;display:flex;justify-content:center}
.foot-in{max-width:1000px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--l);border-radius:12px;padding:12px 14px;background:var(--s)}
.card h4{margin:0 0 5px;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--d)}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:#3B4A5C}

/* ═════════ L'ÉCRAN COMMUN — la disposition de la capture, jamais modifiée ═════════
   La SCÈNE est l'image de référence fournie par la Direction (ou, pour la nébuleuse, son rendu au canevas).
   Règles tenues (Gate AI Core + UI/UX Pro Max) : le verre habille la navigation et les contrôles, le fil est
   posé sur une feuille lisible ; deux mouvements porteurs de sens (la scène, la présence de l'Architecte) ;
   aucune icône sans libellé ; contraste mesuré ; mouvement et transparence réduits respectés. */
.app{color:var(--ink);font-family:var(--body);background:var(--bg0);--padL:0px}
.app[data-device=desktop]{--padL:60px}
.app[data-device=desktop].t2,.app[data-device=desktop].t3{--padL:318px}
.sky{position:absolute;inset:0;z-index:0;background-repeat:no-repeat;transform-origin:50% 60%;animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{0%{transform:scale(1)}100%{transform:scale(1.06)}}
.sky::after{content:'';position:absolute;inset:0;background:var(--scrim)}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.veil{position:absolute;left:0;top:0;width:100%;height:22%;z-index:3;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:2}
.scroll::-webkit-scrollbar{display:none}

/* ── la matière : verre (chrome) et feuille (contenu) ── */
.glass{position:relative;background:var(--panel);border:var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
 box-shadow:var(--sh-md),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--spec)}
.sheet{background:var(--sheet);border:1px solid var(--sheetBd);box-shadow:var(--sh-sm);color:var(--sheetInk)}
.sheet .h b,.sheet p{color:inherit}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--panelSolid);backdrop-filter:none;-webkit-backdrop-filter:none}}

/* ── bande du haut (en-tête + sous-barre), en verre, comme dans l'application ── */
.hd,.sub{position:relative;z-index:2;color:var(--inkTop);background:var(--band);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.hd{display:flex;align-items:center;gap:8px;padding:13px 15px 8px}
.sub{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:6px 15px 13px;border-bottom:var(--bandBd);margin-bottom:13px}
.mode{display:none;position:relative;z-index:2;padding:8px 15px 0;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--inkTop);opacity:.75;background:var(--band)}
.hd .logo{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 auto;background:var(--brandGrad);color:#fff;box-shadow:var(--sh-sm)}
.hd .logo svg{width:22px;height:22px}
.hd .nm{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.08;letter-spacing:-.015em;max-width:112px}
.hd .rnd{width:44px;height:44px;border-radius:var(--r-rnd);display:grid;place-items:center;flex:0 0 auto;color:var(--inkTop);transition:transform .22s,color .22s}
.hd .rnd:hover{color:var(--acc);transform:translateY(-1px)}
.hd .rnd:active{transform:scale(.96)}
.hd .rnd svg{width:19px;height:19px}
.hd .arch-h{color:var(--acc)}
.hd .arch-h::after{content:'';position:absolute;inset:-4px;border-radius:inherit;border:1.5px solid var(--accBd);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.18);opacity:0}}
.hd .pal{display:flex;align-items:center;gap:5px;padding:0 11px;height:40px;border-radius:var(--r-rnd);border:1px solid var(--warmBd);color:var(--warm);background:var(--warmSoft);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.hd .pal svg{width:16px;height:16px}
.hd .cr{margin-left:auto;display:flex;align-items:center;gap:4px;padding:8px 13px;border-radius:var(--r-rnd);background:var(--goldSoft);border:1px solid var(--goldBd);color:var(--gold);font-family:var(--disp);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto}
.hd .cr i{font-style:normal;font-size:10px;opacity:.75}
.hd .av{width:40px;height:40px;border-radius:var(--r-rnd);overflow:hidden;flex:0 0 auto;border:var(--bd);box-shadow:var(--sh-xs)}
.hd .av svg{width:100%;height:100%;display:block}
.sub .sq{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--inkTop);transition:transform .22s,color .22s}
.sub .sq:hover{color:var(--acc);transform:translateY(-1px)}
.sub .sq svg{width:19px;height:19px}
.sub .exp{display:flex;align-items:center;gap:9px;min-height:46px;padding:10px 20px;border-radius:var(--r-rnd);background:var(--expBg);border:var(--expBd);color:var(--expInk);font-weight:700;font-size:14.5px;box-shadow:var(--expSh);transition:transform .24s,box-shadow .24s}
.sub .exp:hover{transform:translateY(-2px)}
.sub .exp:active{transform:scale(.98)}
.sub .exp svg{width:19px;height:19px}

/* ── carte Réseau Mooc ── */
.mooc{margin:0 15px 13px;padding:18px 17px 16px;border-radius:var(--r-lg);position:relative;overflow:hidden;color:var(--inkPanel)}
.mooc .top{display:flex;align-items:flex-start;gap:13px;position:relative}
.mooc .ic{width:54px;height:54px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 auto;background:var(--brandGrad);color:#fff;box-shadow:var(--sh-sm)}
.mooc .ic svg{width:27px;height:27px}
.mooc h1{margin:0;font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.02;letter-spacing:-.025em;color:inherit}
.mooc .tag{margin-left:auto;padding:9px 14px;border-radius:var(--r-md);font-size:12px;font-weight:600;line-height:1.25;color:inherit;background:var(--chip);border:var(--bd);text-align:center;max-width:132px;flex:0 0 auto;opacity:.92}
.mooc .dsc{margin:10px 0 13px;font-size:14px;line-height:1.5;color:inherit;opacity:.85;max-width:44ch;position:relative}
.mooc .tabs{display:flex;gap:3px;padding:4px;border-radius:var(--r-md);background:var(--well);overflow-x:auto;scrollbar-width:none;margin-bottom:13px;position:relative;
 -webkit-mask-image:linear-gradient(90deg,#000 84%,transparent 99%);mask-image:linear-gradient(90deg,#000 84%,transparent 99%)}
.mooc .tabs::-webkit-scrollbar{display:none}
.mooc .tabs button{flex:0 0 auto;min-height:40px;padding:8px 15px;border-radius:calc(var(--r-md) - 4px);font-size:14px;font-weight:600;color:inherit;opacity:.8;white-space:nowrap;transition:.22s;position:relative}
.mooc .tabs button:hover{opacity:1}
.mooc .tabs button[aria-current=true]{background:var(--tabOn);color:var(--tabInk);opacity:1;font-weight:700;box-shadow:var(--tabSh)}
.mooc .tabs button::after{content:'';position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pros);box-shadow:0 0 8px 2px var(--prosGlow);opacity:0;transform:scale(.4);transition:.3s cubic-bezier(.2,.9,.2,1)}
.mooc .tabs button[aria-current=true]::after{opacity:1;transform:scale(1)}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E5484D;margin-left:6px;vertical-align:2px}
.mooc .mine{display:flex;align-items:center;gap:10px;min-height:46px;padding:12px 19px;border-radius:var(--r-rnd);background:var(--mineBg);color:var(--mineInk);border:var(--mineBd);font-weight:700;font-size:15px;box-shadow:var(--sh-md);position:relative;overflow:hidden;transition:transform .24s,box-shadow .24s}
.mooc .mine:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.mooc .mine:active{transform:scale(.98)}
.mooc .mine .b{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--brandInk);font-size:9px;font-weight:800;letter-spacing:-.03em;position:relative}
.mooc .mine span:last-child{position:relative}

/* ── stories ── */
.st{margin:0 15px 13px;padding:14px 13px 12px;border-radius:var(--r-lg);position:relative;color:var(--inkPanel)}
.st .row{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;position:relative;-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent 99%);mask-image:linear-gradient(90deg,#000 84%,transparent 99%)}
.st .row::-webkit-scrollbar{display:none}
.st .one{flex:0 0 auto;width:78px;text-align:center;position:relative}
.st .one .ph{width:74px;height:74px;border-radius:var(--r-ph);overflow:hidden;position:relative;margin:0 auto 7px;border:2.5px solid var(--ring);box-shadow:var(--phSh);transition:transform .26s,border-color .26s}
.st .one:hover .ph{transform:translateY(-3px);border-color:var(--acc)}
.st .one .ph svg{width:100%;height:100%;display:block}
.st .one.me .ph{border-color:var(--bdSoft);background:var(--well);display:grid;place-items:center}
.st .one.me .plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-sm)}
.st .one.me .plus svg{width:17px;height:17px}
.st .one b{display:block;font-size:12.5px;font-weight:600;color:inherit;line-height:1.2}
.ring-live{position:absolute;inset:-3.5px;border-radius:inherit;pointer-events:none;background:conic-gradient(from var(--rg,0deg),transparent 0 58%,var(--pros) 74%,var(--acc) 88%,transparent 96%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:2.5px;animation:spin 4.5s linear infinite}
@keyframes spin{to{--rg:360deg}}
@property --rg{syntax:'<angle>';initial-value:0deg;inherits:false}
.st .one.live .lbl{display:inline-block;margin-top:3px;font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pros)}
.st .prog{height:8px;border-radius:5px;background:var(--well);margin-top:11px;overflow:hidden;position:relative}
.st .prog i{display:block;height:100%;width:38%;border-radius:5px;background:linear-gradient(90deg,var(--pros),var(--acc))}

/* ── le fil ── */
.fd{margin:0 15px;display:grid;gap:11px;padding-bottom:132px;position:relative}
.fd article{padding:14px 15px;border-radius:var(--r-lg)}
.fd .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.fd .h svg{width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.fd .h b{font-size:14px;font-weight:700}
.fd .h i{font-style:normal;font-size:12px;opacity:.6;margin-left:auto}
.fd p{margin:0;font-size:14.5px;line-height:1.55}
.fd .acts{display:flex;gap:16px;margin-top:10px;font-size:12.5px;font-weight:600;opacity:.6}
.fd .acts span{transition:color .2s;cursor:pointer}
.fd .acts span:hover{color:var(--acc)}

/* ── goutte messagerie — conservée ── */
.drop{position:absolute;right:16px;bottom:112px;width:58px;height:58px;z-index:40;border-radius:52% 52% 48% 48%/58% 58% 42% 42%;display:grid;place-items:center;color:var(--dropInk);transition:transform .24s cubic-bezier(.2,.9,.2,1)}
.drop:hover{transform:translateY(-3px)}
.drop:active{transform:scale(.96)}
.drop .cup{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.drop .lvl{position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--acc);opacity:.26}
.drop .lvl::before{content:'';position:absolute;left:-10%;right:-10%;top:-6px;height:12px;border-radius:50%;background:inherit;opacity:.6}
.drop svg{position:relative;width:23px;height:23px}
.drop .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--alert);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;font-variant-numeric:tabular-nums}

/* ── dock — Architecte au centre, en relief, avec son libellé ── */
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:68px;z-index:41;border-radius:var(--r-dock);display:flex;align-items:center;justify-content:space-around;padding:0 6px;color:var(--inkTop)}
.dock>button{width:56px;height:56px;border-radius:var(--r-sm);display:grid;place-items:center;align-content:center;gap:3px;color:inherit;opacity:.7;transition:opacity .2s,transform .2s;position:relative}
.dock>button:hover{opacity:1}
.dock>button:active{transform:scale(.95)}
.dock>button svg{width:22px;height:22px}
.dock>button em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.02em;line-height:1}
.dock>button[aria-current=true]{color:var(--acc);opacity:1}
.dock>button[aria-current=true]::after{content:'';position:absolute;left:50%;top:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--pros);box-shadow:0 0 8px 2px var(--prosGlow)}
.dock .arch{width:78px;height:68px;grid-template-rows:auto auto;gap:2px;overflow:visible;opacity:1}
.dock .arch .orb{width:58px;height:58px;margin-top:-34px;border-radius:var(--r-arch);display:grid;place-items:center;position:relative;background:var(--archBg);border:var(--archBd);color:var(--archInk);box-shadow:var(--archSh);transition:transform .3s cubic-bezier(.2,.9,.2,1),box-shadow .3s}
.dock .arch:hover .orb{transform:translateY(-4px) scale(1.05)}
.dock .arch .orb svg{width:27px;height:27px;position:relative}
.dock .arch em{color:var(--acc)}
.dock .arch .orb::before{content:'';position:absolute;inset:-7px;border-radius:calc(var(--r-arch) + 7px);border:1.5px solid var(--archRing);animation:pulse 4.2s ease-in-out infinite}
.aura{position:absolute;inset:-16px;border-radius:50%;pointer-events:none;z-index:-1;opacity:.6;background:conic-gradient(from 0deg,transparent,var(--pros),var(--acc),transparent 72%);filter:blur(10px);animation:aura 9s linear infinite}
@keyframes aura{to{transform:rotate(360deg)}}

/* ── TÉLÉPHONE ── */
.app[data-device=mobile] .hd{gap:3px;padding:11px 12px 6px}
.app[data-device=mobile] .hd .logo{width:32px;height:32px;border-radius:calc(var(--r-sm) - 2px)}
.app[data-device=mobile] .hd .logo svg{width:18px;height:18px}
.app[data-device=mobile] .hd .nm{font-size:12px;max-width:66px;flex:0 0 auto;line-height:1.12}
.app[data-device=mobile] .hd .rnd{width:38px;height:38px}
.app[data-device=mobile] .hd .rnd svg{width:17px;height:17px}
.app[data-device=mobile] .hd .pal{height:32px;padding:0 7px;gap:3px;font-size:11px}
.app[data-device=mobile] .hd .pal svg{width:14px;height:14px}
.app[data-device=mobile] .hd .cr{padding:6px 7px;font-size:10.5px;gap:3px}
.app[data-device=mobile] .hd .av{width:32px;height:32px}
.app[data-device=mobile] .sub{padding:4px 12px 12px}
.app[data-device=mobile] .mode{padding:7px 12px 0}
.app[data-device=mobile] .mooc,.app[data-device=mobile] .st,.app[data-device=mobile] .fd{margin-inline:12px}
.app[data-device=mobile].t1 .hd .nm,.app[data-device=mobile].t4 .hd .nm{font-size:9.5px;letter-spacing:.04em;max-width:66px}

/* ── ORDINATEUR ── */
.app[data-device=desktop] .scroll{padding:0 0 0 var(--padL)}
.app[data-device=desktop] .hd,.app[data-device=desktop] .sub,.app[data-device=desktop] .mode{margin-left:calc(-1*var(--padL));padding-left:var(--padL);padding-right:40px}
.app[data-device=desktop] .veil{height:19%}
.app[data-device=desktop] .hd{padding-top:14px;padding-bottom:8px}
.app[data-device=desktop] .hd .nm{max-width:none;font-size:18px}
.app[data-device=desktop] .sub{padding-bottom:14px;margin-bottom:16px}
.app[data-device=desktop] .mooc,.app[data-device=desktop] .st,.app[data-device=desktop] .fd{margin-inline:0;max-width:860px}
.app[data-device=desktop] .mooc h1{font-size:33px}
.app[data-device=desktop] .mooc .top{max-width:880px}
.app[data-device=desktop] .mooc .tabs{width:max-content;max-width:100%}
.app[data-device=desktop] .fd{padding-bottom:124px;grid-template-columns:1fr 1fr}
/* sur ordinateur, la zone de contenu est DÉPOLIE à la matière du modèle (flou d'arrière-plan masqué) :
   la colonne libre garde la scène nette ; ce qui passe sous les panneaux devient un champ de verre dépoli,
   comme le panneau de vos images — et rien de ce qui est cuit dans l'image n'y reste lisible */
.frost{position:absolute;inset:0;z-index:1;pointer-events:none;display:none}
.app[data-device=desktop].t2 .frost,.app[data-device=desktop].t3 .frost,.app[data-device=desktop].t4 .frost{display:block;backdrop-filter:blur(18px) saturate(1.05);-webkit-backdrop-filter:blur(18px) saturate(1.05)}
.app[data-device=desktop].t2 .frost{background:rgba(255,250,244,.5);-webkit-mask:linear-gradient(90deg,transparent 296px,#000 352px);mask:linear-gradient(90deg,transparent 296px,#000 352px)}
.app[data-device=desktop].t3 .frost{background:rgba(12,56,44,.62);-webkit-mask:linear-gradient(90deg,transparent 296px,#000 352px),linear-gradient(180deg,#000 138px,transparent 138px);mask:linear-gradient(90deg,transparent 296px,#000 352px),linear-gradient(180deg,#000 138px,transparent 138px);-webkit-mask-composite:source-over;mask-composite:add}
.app[data-device=desktop].t4 .frost{background:rgba(236,243,248,.55);-webkit-mask:linear-gradient(90deg,transparent 30px,#000 62px,#000 918px,transparent 950px);mask:linear-gradient(90deg,transparent 30px,#000 62px,#000 918px,transparent 950px)}
@media (prefers-reduced-transparency:reduce){.frost{display:none!important}}
.app[data-device=desktop] .dock{left:50%;right:auto;transform:translateX(-50%);width:auto;justify-content:center;gap:6px;padding:0 14px}
.app[data-device=desktop] .drop{right:26px;bottom:104px}

function fitScene(el,cls,device){
 const img=IMG[cls];if(!img){el.style.backgroundImage='';return;}
 const r=REGION[cls][device],W=el.offsetWidth,H=el.offsetHeight;
 const s=Math.max(W/r.w,H/r.h);
 el.style.backgroundImage=`url(${img})`;
 el.style.backgroundSize=`${SRC.w*s}px ${SRC.h*s}px`;
 el.style.backgroundPosition=`${-(r.x*s)+(W-r.w*s)/2}px ${-(r.y*s)+(H-r.h*s)/2}px`;
}

/* ═══ LA VIE DES SCÈNES — ce qui bouge par-dessus vos images (ou la nébuleuse entière) ═══ */
const SCENES={
 t1(W,H,R){ // brume qui dérive sur le lac, rides sur l'eau
  const mists=Array.from({length:6},()=>({x:R()*W,y:H*(.3+R()*.5),rx:W*(.3+R()*.3),ry:H*(.05+R()*.06),v:(R()-.5)*6,a:.22+R()*.22}));
  return {back(cx,t){cx.clearRect(0,0,W,H);
   const wy=H*.7;cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=1;
   for(let i=0;i<12;i++){const y=wy+8+i*((H-wy)/12),ph=t*.3+i*.8;cx.beginPath();for(let x=0;x<=W;x+=10)cx.lineTo(x,y+Math.sin(x*.016+ph)*(1+i*.12));cx.stroke();}
   for(const m of mists){m.x+=m.v*.016;if(m.x>W+m.rx)m.x=-m.rx;if(m.x<-m.rx)m.x=W+m.rx;
    cx.save();cx.translate(m.x,m.y);cx.scale(1,m.ry/m.rx);const g=cx.createRadialGradient(0,0,0,0,0,m.rx);g.addColorStop(0,`rgba(255,255,255,${m.a})`);g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,m.rx,0,6.3);cx.fill();cx.restore();}}};
 },
 t2(W,H,R){ // le voile passe devant la barre, la lagune scintille
  return {back(cx,t){cx.clearRect(0,0,W,H);const ly=H*.74;cx.strokeStyle='rgba(255,255,255,.75)';
   for(let i=0;i<9;i++){const y=ly+i*((H-ly)/9);cx.lineWidth=1+(i%3);cx.globalAlpha=.18+.05*i;cx.beginPath();for(let x=0;x<=W;x+=10)cx.lineTo(x,y+Math.sin(x*.014+t*.45+i)*1.3);cx.stroke();}
   cx.globalAlpha=1;},
  front(cx,t){const h=cx.canvas.height/(cx.getTransform().d||1);cx.clearRect(0,0,W,h);const x0=W*.04,x1=W*.5;
   cx.save();cx.shadowColor='rgba(120,85,55,.16)';cx.shadowBlur=26;cx.fillStyle='rgba(255,255,255,.4)';
   cx.beginPath();cx.moveTo(x0+Math.sin(t*.6)*14,-30);for(let y=-30;y<=h+30;y+=14)cx.lineTo(x1+Math.sin(y*.011+t*.7)*24,y);
   for(let y=h+30;y>=-30;y-=14)cx.lineTo(x0+Math.sin(y*.013+t*.55)*18,y);cx.closePath();cx.fill();
   cx.fillStyle='rgba(255,255,255,.28)';cx.beginPath();for(let y=-30;y<=h+30;y+=14)cx.lineTo(x1-44+Math.sin(y*.019+t*.9)*18,y);
   for(let y=h+30;y>=-30;y-=14)cx.lineTo(x1-98+Math.sin(y*.017+t*.8)*16,y);cx.closePath();cx.fill();cx.restore();}};
 },
 t3(W,H,R){ // rosée qui se condense et glisse sur le verre vert
  const drops=[];const spawn=()=>drops.push({x:R()*W,y:R()*H*.92,r:0,tr:2.2+R()*5.5,age:0,life:4+R()*7,vy:0,slide:R()<.55});
  for(let i=0;i<18;i++){spawn();drops[i].age=R()*4;}
  return {back(cx,t){cx.clearRect(0,0,W,H);if(drops.length<30&&R()<.03)spawn();
   for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age+=.016;
    if(d.age<1.4)d.r=d.tr*Math.min(1,d.age/1.4);else if(d.age>d.life&&d.slide){d.vy+=.045;d.y+=d.vy;if(d.y>H+10){drops.splice(i,1);continue;}}
    else if(d.age>d.life+2.5){drops.splice(i,1);continue;}
    cx.fillStyle='rgba(0,20,12,.18)';cx.beginPath();cx.arc(d.x+.9,d.y+1.3,d.r,0,6.3);cx.fill();
    const g=cx.createRadialGradient(d.x-d.r*.4,d.y-d.r*.45,0,d.x,d.y,d.r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.55,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(160,230,200,.5)');
    cx.fillStyle=g;cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.3);cx.fill();
    cx.strokeStyle='rgba(255,255,255,.95)';cx.lineWidth=.9;cx.beginPath();cx.arc(d.x,d.y,d.r*.68,3.5,4.9);cx.stroke();}}};
 },
 t4(W,H,R){ // brume qui glisse sur la mer, éclats de lumière sur l'eau
  const mists=Array.from({length:5},()=>({x:R()*W,y:H*(.35+R()*.4),rx:W*(.3+R()*.3),ry:H*(.04+R()*.05),v:(R()-.5)*7,a:.22+R()*.2}));
  return {back(cx,t){cx.clearRect(0,0,W,H);
   for(const m of mists){m.x+=m.v*.016;if(m.x>W+m.rx)m.x=-m.rx;if(m.x<-m.rx)m.x=W+m.rx;
    cx.save();cx.translate(m.x,m.y);cx.scale(1,m.ry/m.rx);const g=cx.createRadialGradient(0,0,0,0,0,m.rx);g.addColorStop(0,`rgba(255,255,255,${m.a})`);g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,m.rx,0,6.3);cx.fill();cx.restore();}
   const wy=H*.8;for(let i=0;i<40;i++){const x=(i*97+t*14)%W,y=wy+((i*53)%(H-wy)),a=.35+.35*Math.sin(t*2.2+i);
    cx.fillStyle=`rgba(255,255,255,${a})`;cx.fillRect(x,y,2+(i%3),1);}}};
 },
 t5(W,H,R){ // la nébuleuse entière : voiles indigo/violet qui dérivent, étoiles, sol d'eau ondulée
  const glows=Array.from({length:6},()=>({x:R()*W,y:R()*H*.8,r:W*(.25+R()*.35),v:(R()-.5)*5,vy:(R()-.5)*3,c:R()<.5?'120,110,255':'70,140,255',a:.22+R()*.2}));
  const stars=Array.from({length:110},()=>({x:R()*W,y:R()*H,r:.5+R()*1.4,ph:R()*6.3,s:.4+R()*1.2}));
  return {back(cx,t){
   const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0A1240');g.addColorStop(.6,'#10195A');g.addColorStop(1,'#0B1447');cx.fillStyle=g;cx.fillRect(0,0,W,H);
   for(const q of glows){q.x+=q.v*.016;q.y+=q.vy*.016;if(q.x<-q.r)q.x=W+q.r;if(q.x>W+q.r)q.x=-q.r;if(q.y<-q.r)q.y=H;if(q.y>H+q.r)q.y=0;
    const rg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);rg.addColorStop(0,`rgba(${q.c},${q.a})`);rg.addColorStop(1,`rgba(${q.c},0)`);cx.fillStyle=rg;cx.fillRect(0,0,W,H);}
   for(const s of stars){const a=.35+.6*Math.abs(Math.sin(t*s.s+s.ph));cx.fillStyle=`rgba(220,225,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill();}
   const wy=H*.78;cx.strokeStyle='rgba(150,170,255,.35)';cx.lineWidth=1;
   for(let i=0;i<10;i++){const y=wy+i*((H-wy)/10),ph=t*.35+i;cx.beginPath();for(let x=0;x<=W;x+=10)cx.lineTo(x,y+Math.sin(x*.02+ph)*2);cx.stroke();}}};
 }};

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(r,cls,device){
 const tabs=[...r.querySelectorAll('.tabs button')];
 tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-current','false'));t.setAttribute('aria-current','true');});
 const dk=[...r.querySelectorAll('.dock>button')];
 dk.forEach(b=>b.onclick=()=>{dk.forEach(x=>x.setAttribute('aria-current','false'));b.setAttribute('aria-current','true');});
 fitScene(r.querySelector('.sky'),cls,device);
 const dpr=Math.min(devicePixelRatio||1,1.5);
 const back=r.querySelector('.scene'),front=r.querySelector('.veil');
 const W=back.offsetWidth,H=back.offsetHeight,FH=front.offsetHeight;
 back.width=W*dpr;back.height=H*dpr;front.width=W*dpr;front.height=FH*dpr;
 const bx=back.getContext('2d'),fx=front.getContext('2d');bx.scale(dpr,dpr);fx.scale(dpr,dpr);
 let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
 const sc=SCENES[cls](W,H,R);
 if(!sc.front)front.remove();
 let raf=0,t=0,last=performance.now();
 const draw=(nowMs)=>{const dt=Math.min(.05,(nowMs-last)/1000);last=nowMs;if(!RM)t+=dt;
  sc.back(bx,t);if(sc.front)sc.front(fx,t);if(!RM)raf=requestAnimationFrame(draw);};
 raf=requestAnimationFrame(draw);
 const onR=()=>fitScene(r.querySelector('.sky'),cls,device);addEventListener('resize',onR);
 return()=>{cancelAnimationFrame(raf);removeEventListener('resize',onR);};
}

const app=document.getElementById('app'),frame=document.getElementById('frame');
let device='mobile',cur=0,clean=null;
function render(){
 if(clean){try{clean()}catch(e){}clean=null;}
 const t=T[cur];
 app.className='app '+t.cls;app.dataset.device=device;frame.dataset.device=device;
 app.innerHTML=screen();
 clean=wire(app,t.cls,device);
 document.getElementById('mid').textContent=String(t.n).padStart(2,'0')+' / 05';
 document.getElementById('mname').textContent=t.name;
 document.getElementById('mprin').textContent=t.prin;
 document.getElementById('cRef').textContent=t.ref;
 document.getElementById('cMat').textContent=t.mat;
 document.getElementById('cForm').textContent=t.form;
 document.getElementById('cMove').textContent=t.move;
 [...document.querySelectorAll('.dot')].forEach((d,i)=>d.setAttribute('aria-current',String(i===cur)));
}
const dots=document.getElementById('dots');
T.forEach((t,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=t.n;b.setAttribute('role','tab');b.title=t.name;b.onclick=()=>{cur=i;render();};dots.appendChild(b);});
document.getElementById('prev').onclick=()=>{cur=(cur+T.length-1)%T.length;render();};
document.getElementById('next').onclick=()=>{cur=(cur+1)%T.length;render();};
document.getElementById('bDesk').onclick=()=>{device='desktop';document.getElementById('bDesk').setAttribute('aria-pressed','true');document.getElementById('bMob').setAttribute('aria-pressed','false');render();};
document.getElementById('bMob').onclick=()=>{device='mobile';document.getElementById('bMob').setAttribute('aria-pressed','true');document.getElementById('bDesk').setAttribute('aria-pressed','false');render();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
render();
</script>
