<title>Menus Vivants MokNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ═════════ COQUILLE DE GALERIE ═════════ */
:root{--g:#0A0E14;--s:#121821;--l:#212B38;--t:#E9EFF6;--m:#8494A6;--d:#5C6B7C;--a:#59C2FF;
 --disp:'Outfit',system-ui,sans-serif;--txt:'Plus Jakarta Sans',system-ui,sans-serif;
 --tech:'Space Grotesk',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--t);font-family:var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:6px}
.lab{min-height:100vh;display:flex;flex-direction:column}
.lab>.bar{display:flex;align-items:center;gap:16px;padding:13px 20px;border-bottom:1px solid var(--l);
 background:#0D131B;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.bar-id{font-family:var(--disp);font-weight:300;font-size:12.5px;letter-spacing:.22em;color:var(--d);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-name{font-family:var(--disp);font-weight:600;font-size:19px;white-space:nowrap}
.bar-p{color:var(--m);font-size:13px;line-height:1.45;flex:1;min-width:200px;max-width:58ch}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.step{width:36px;height:36px;border:1px solid var(--l);border-radius:10px;display:grid;place-items:center;
 background:var(--s);transition:.18s}
.step:hover{border-color:#39485C;background:#171F2A}
.seg{display:flex;border:1px solid var(--l);border-radius:10px;overflow:hidden;background:var(--s)}
.seg button{padding:8px 13px;font-size:12px;font-weight:600;color:var(--m);transition:.18s}
.seg button[aria-pressed=true]{background:rgba(89,194,255,.16);color:var(--a)}
.dots{display:flex;gap:5px}
.dot{width:29px;height:29px;border-radius:8px;border:1px solid var(--l);background:var(--s);
 font-size:11.5px;font-weight:700;color:var(--d);font-variant-numeric:tabular-nums;transition:.18s}
.dot[aria-current=true]{border-color:var(--a);color:var(--a);background:rgba(89,194,255,.16)}
.stage{flex:1;display:grid;place-items:center;padding:24px 20px 30px;overflow:auto}
.frame{position:relative;background:#fff;overflow:hidden;
 transition:width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1),border-radius .4s}
.frame[data-device=desktop]{width:min(1180px,94vw);aspect-ratio:16/10;border-radius:13px;
 border:1px solid #232E3C;box-shadow:0 40px 100px -30px rgba(0,0,0,.9)}
.frame[data-device=mobile]{width:min(390px,92vw);aspect-ratio:390/812;border-radius:38px;
 border:9px solid #1A222D;box-shadow:0 40px 90px -28px rgba(0,0,0,.9)}
.app{position:absolute;inset:0;overflow:hidden;isolation:isolate}
.foot{padding:0 20px 24px;display:flex;justify-content:center}
.foot-in{max-width:960px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--l);border-radius:12px;padding:12px 14px;background:var(--s)}
.card h4{margin:0 0 5px;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.16em;
 text-transform:uppercase;color:var(--d)}
.card p{margin:0;font-size:12.5px;line-height:1.5;color:#B2C1D0}

/* ═════════ ÉCRAN COMMUN — la disposition de la capture, jamais modifiée ═════════
   header · sous-barre Équipe & Experts · carte Réseau Mooc (onglets + Mon Espace)
   · stories · début du fil · goutte messagerie · dock à 5 avec Architecte central
   Seuls le MATÉRIAU, la FORME, la COULEUR, la TYPOGRAPHIE et le MOUVEMENT changent. */
.app{color:var(--ink);font-family:var(--body)}
.sky{position:absolute;inset:0;pointer-events:none}
.motes{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ── couche d'animation commune aux cinq : rien n'est jamais figé ── */
/* éclat qui traverse un élément — prospérité, richesse */
.shine{position:relative;overflow:hidden}
.shine::after{content:'';position:absolute;top:-60%;bottom:-60%;width:34%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
 transform:translateX(-260%) skewX(-18deg);animation:shine 6.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes shine{0%{transform:translateX(-260%) skewX(-18deg)}
 42%,100%{transform:translateX(420%) skewX(-18deg)}}
/* anneau vert tournant — souveraineté, vitalité */
.ring-live{position:absolute;inset:-3.5px;border-radius:inherit;pointer-events:none;
 background:conic-gradient(from var(--rg,0deg),transparent 0 58%,var(--pros) 74%,var(--acc) 88%,transparent 96%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;padding:2.5px;animation:spin 4.5s linear infinite}
@keyframes spin{to{--rg:360deg}}
@property --rg{syntax:'<angle>';initial-value:0deg;inherits:false}
/* barre de progression qui avance réellement */
@keyframes grow{0%{width:14%}50%{width:64%}100%{width:14%}}
/* compteur vivant */
@keyframes tick{0%,92%{opacity:1}96%{opacity:.45}100%{opacity:1}}
/* halo conique lent derrière l'Architecte du dock — signature de l'application */
.aura{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;z-index:-1;opacity:.55;
 background:conic-gradient(from 0deg,transparent,var(--pros),var(--acc),transparent 72%);
 filter:blur(9px);animation:aura 8s linear infinite}
@keyframes aura{to{transform:rotate(360deg)}}
/* la tuile Réseau Mooc respire et capte un reflet */
.mooc .ic{position:relative;overflow:hidden;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.mooc .ic::after{content:'';position:absolute;top:-60%;bottom:-60%;width:44%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
 transform:translateX(-240%) skewX(-18deg);animation:shine 5.5s cubic-bezier(.4,0,.2,1) infinite 1.2s}
/* point rouge vivant sur l'onglet Lives */
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:#EF4444;margin-left:6px;
 vertical-align:2px;animation:blink 1.9s ease-in-out infinite;box-shadow:0 0 0 0 rgba(239,68,68,.6)}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55);opacity:1}
 60%{box-shadow:0 0 0 6px rgba(239,68,68,0);opacity:.75}}
/* la goutte messagerie flotte doucement */
.drop{animation:bob 5.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* le bouton Experts respire */
.sub .exp{animation:lift 7s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
/* filet lumineux qui parcourt la carte Réseau Mooc */
.thread{position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;z-index:3;
 background:linear-gradient(90deg,transparent,var(--pros),var(--acc),transparent);
 background-size:46% 100%;background-repeat:no-repeat;animation:thread 6.5s linear infinite}
@keyframes thread{0%{background-position:-46% 0}100%{background-position:146% 0}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:2}
.scroll::-webkit-scrollbar{display:none}

/* header */
.hd{display:flex;align-items:center;gap:9px;padding:13px 15px}
.hd .logo{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 auto;
 background:var(--brandGrad);color:#fff;box-shadow:var(--sh-sm)}
.hd .logo svg{width:22px;height:22px}
.hd .nm{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.05;letter-spacing:-.015em;
 color:var(--ink);max-width:110px}
.hd .rnd{width:38px;height:38px;border-radius:var(--r-rnd);display:grid;place-items:center;flex:0 0 auto;
 background:var(--chip);border:var(--bd);color:var(--ink2);transition:.2s;box-shadow:var(--sh-xs)}
.hd .rnd:hover{background:var(--chipH);color:var(--acc)}
.hd .rnd svg{width:18px;height:18px}
.hd .arch-h{border-color:var(--accBd);color:var(--acc);background:var(--accSoft);position:relative}
.hd .arch-h::after{content:'';position:absolute;inset:-4px;border-radius:var(--r-rnd);
 border:1px solid var(--accBd);animation:pulse 3.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.16);opacity:0}}
.hd .pal{display:flex;align-items:center;gap:5px;padding:0 11px;height:38px;border-radius:var(--r-rnd);
 border:1px solid var(--warmBd);color:var(--warm);background:var(--warmSoft);font-size:13px;font-weight:700;
 font-variant-numeric:tabular-nums;flex:0 0 auto}
.hd .pal svg{width:17px;height:17px}
.hd .cr{margin-left:auto;display:flex;align-items:center;gap:4px;padding:7px 13px;border-radius:var(--r-rnd);
 background:var(--goldSoft);border:1px solid var(--goldBd);color:var(--gold);
 font-family:var(--tech);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto}
.hd .cr i{font-style:normal;font-size:10px;opacity:.75}
.hd .cr b{font-weight:700;animation:tick 3.4s ease-in-out infinite}
.hd .av{width:38px;height:38px;border-radius:var(--r-rnd);overflow:hidden;flex:0 0 auto;border:var(--bd);box-shadow:var(--sh-xs)}
.hd .av svg{width:100%;height:100%;display:block}

/* sous-barre Équipe & Experts */
.sub{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:9px 15px 12px}
.sub .sq{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;
 background:var(--chip);border:var(--bd);color:var(--ink2);transition:.2s;box-shadow:var(--sh-xs)}
.sub .sq:hover{background:var(--chipH);color:var(--acc)}
.sub .sq svg{width:18px;height:18px}
.sub .exp{display:flex;align-items:center;gap:9px;padding:10px 19px;border-radius:var(--r-rnd);
 background:var(--expBg);border:var(--expBd);color:var(--expInk);font-weight:700;font-size:14px;
 box-shadow:var(--sh-md);transition:transform .26s,box-shadow .26s}
.sub .exp:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.sub .exp svg{width:19px;height:19px}

/* carte Réseau Mooc */
.mooc{margin:0 15px 13px;padding:17px 17px 15px;border-radius:var(--r-lg);position:relative;overflow:hidden;
 background:var(--panel);border:var(--bd);box-shadow:var(--sh-md);backdrop-filter:var(--blur)}
.mooc .top{display:flex;align-items:flex-start;gap:13px}
.mooc .ic{width:54px;height:54px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 auto;
 background:var(--brandGrad);color:#fff;box-shadow:var(--sh-sm)}
.mooc .ic svg{width:27px;height:27px}
.mooc h1{margin:0;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.04;
 letter-spacing:-.025em;color:var(--ink)}
.mooc .tag{margin-left:auto;padding:9px 14px;border-radius:var(--r-md);font-size:12px;font-weight:600;
 line-height:1.25;color:var(--ink2);background:var(--chip);border:var(--bd);text-align:center;max-width:130px;flex:0 0 auto}
.mooc .dsc{margin:9px 0 13px;font-size:13.5px;line-height:1.5;color:var(--ink2);max-width:44ch}
.mooc .tabs{display:flex;gap:3px;padding:4px;border-radius:var(--r-md);background:var(--well);
 overflow-x:auto;scrollbar-width:none;margin-bottom:13px}
.mooc .tabs::-webkit-scrollbar{display:none}
.mooc .tabs button{flex:0 0 auto;padding:9px 15px;border-radius:calc(var(--r-md) - 4px);font-size:13.5px;
 font-weight:600;color:var(--ink2);white-space:nowrap;transition:.2s}
.mooc .tabs button:hover{color:var(--ink)}
.mooc .tabs button[aria-current=true]{background:var(--tabOn);color:var(--tabInk);
 font-weight:700;box-shadow:var(--sh-xs)}
.mooc .mine{display:flex;align-items:center;gap:10px;padding:12px 19px;border-radius:var(--r-rnd);
 background:var(--brandGrad);color:#fff;font-weight:700;font-size:14.5px;box-shadow:var(--sh-md);
 transition:transform .26s,box-shadow .26s}
.mooc .mine:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.mooc .mine .b{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.9);display:grid;
 place-items:center;color:var(--brandInk);font-size:9px;font-weight:800;letter-spacing:-.03em}

/* stories */
.st{margin:0 15px 13px;padding:14px 13px 12px;border-radius:var(--r-lg);
 background:var(--panel);border:var(--bd);box-shadow:var(--sh-md);backdrop-filter:var(--blur)}
.st .row{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none}
.st .row::-webkit-scrollbar{display:none}
.st .one{flex:0 0 auto;width:78px;text-align:center}
.st .one .ph{width:74px;height:74px;border-radius:var(--r-md);overflow:hidden;position:relative;
 margin-bottom:7px;border:2.5px solid var(--ring);box-shadow:var(--sh-sm);transition:transform .28s,border-color .28s}
.st .one:hover .ph{transform:translateY(-3px);border-color:var(--acc)}
.st .one .ph svg{width:100%;height:100%;display:block}
.st .one.me .ph{border-color:var(--bdSoft);background:var(--well);display:grid;place-items:center}
.st .one.me .plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;
 border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-sm)}
.st .one.me .plus svg{width:17px;height:17px}
.st .one b{display:block;font-size:12px;font-weight:600;color:var(--ink);line-height:1.2}
.st .prog{height:9px;border-radius:5px;background:var(--well);margin-top:11px;overflow:hidden}
.st .prog i{display:block;height:100%;border-radius:5px;
 background:linear-gradient(90deg,var(--pros),var(--acc));animation:grow 9s ease-in-out infinite}
/* la première story est EN DIRECT : anneau vert qui tourne en continu */
.st .one.live .ph{position:relative}
.st .one.live .lbl{display:inline-block;margin-top:3px;font-size:8.5px;font-weight:800;letter-spacing:.12em;
 text-transform:uppercase;color:var(--pros)}

/* début du fil */
.fd{margin:0 15px;display:grid;gap:11px;padding-bottom:130px}
.fd article{padding:14px 15px;border-radius:var(--r-lg);background:var(--panel);border:var(--bd);
 box-shadow:var(--sh-sm);backdrop-filter:var(--blur)}
.fd .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.fd .h svg{width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.fd .h b{font-size:13.5px;font-weight:700;color:var(--ink)}
.fd .h i{font-style:normal;font-size:11.5px;color:var(--mut);margin-left:auto}
.fd p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.fd .acts{display:flex;gap:16px;margin-top:10px;font-size:12px;font-weight:600;color:var(--mut)}
.fd .acts span{transition:color .2s;cursor:pointer}
.fd .acts span:hover{color:var(--acc)}

/* goutte messagerie — conservée */
.drop{position:absolute;right:16px;bottom:112px;width:56px;height:56px;z-index:40;
 border-radius:52% 52% 48% 48%/58% 58% 42% 42%;display:grid;place-items:center;
 background:var(--dropBg);border:var(--dropBd);box-shadow:var(--sh-lg);color:var(--dropInk)}
.drop .cup{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.drop .lvl{position:absolute;left:0;right:0;bottom:0;height:44%;background:var(--acc);opacity:.22}
.drop svg{position:relative;width:23px;height:23px}
.drop .n{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
 background:var(--alert);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;
 border:2px solid var(--bg0);font-variant-numeric:tabular-nums}

/* dock — Architecte au centre, en relief */
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:66px;z-index:41;border-radius:var(--r-dock);
 background:var(--dockBg);border:var(--dockBd);box-shadow:var(--sh-lg);backdrop-filter:var(--blur);
 display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.dock button{width:52px;height:50px;border-radius:var(--r-sm);display:grid;place-items:center;gap:3px;
 color:var(--mut);transition:color .2s,background .2s;position:relative}
.dock button svg{width:22px;height:22px}
.dock button em{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.03em}
.dock button[aria-current=true]{color:var(--acc)}
.dock .arch{width:66px;height:66px;border-radius:var(--r-arch);margin-top:-26px;
 background:var(--archBg);border:var(--archBd);color:var(--archInk);box-shadow:var(--archSh);
 transition:transform .3s cubic-bezier(.2,.9,.2,1),box-shadow .3s;z-index:2}
.dock .arch svg{width:29px;height:29px}
.dock .arch:hover{transform:translateY(-4px) scale(1.05)}
.dock .arch::before{content:'';position:absolute;inset:-7px;border-radius:calc(var(--r-arch) + 7px);
 border:1px solid var(--archRing);animation:pulse 4.2s ease-in-out infinite}
.dock .n{position:absolute;top:2px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
 background:var(--alert);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center}

/* TÉLÉPHONE — la barre du haut porte les sept éléments de la capture SANS jamais déborder */
.app[data-device=mobile] .hd{gap:6px;padding:11px 12px}
.app[data-device=mobile] .hd .logo{width:32px;height:32px;border-radius:calc(var(--r-sm) - 2px)}
.app[data-device=mobile] .hd .logo svg{width:18px;height:18px}
.app[data-device=mobile] .hd .nm{font-size:12.5px;max-width:70px;min-width:0;line-height:1.14}
.app[data-device=mobile] .hd .rnd{width:30px;height:30px}
.app[data-device=mobile] .hd .rnd svg{width:16px;height:16px}
.app[data-device=mobile] .hd .pal{height:30px;padding:0 8px;gap:3px;font-size:11.5px}
.app[data-device=mobile] .hd .pal svg{width:14px;height:14px}
.app[data-device=mobile] .hd .cr{padding:6px 9px;font-size:11px;gap:3px}
.app[data-device=mobile] .hd .av{width:30px;height:30px}
.app[data-device=mobile] .sub{padding:6px 12px 11px}
.app[data-device=mobile] .mooc,.app[data-device=mobile] .st,.app[data-device=mobile] .fd{margin-inline:12px}
/* les rangées qui défilent s'estompent au bord : on voit qu'il y a une suite */
.mooc .tabs,.st .row{-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent 99%);
 mask-image:linear-gradient(90deg,#000 84%,transparent 99%)}

/* ORDINATEUR — même disposition, respirée */
.app[data-device=desktop] .scroll{padding:0 6%}
.app[data-device=desktop] .hd{padding:16px 0 10px}
.app[data-device=desktop] .hd .nm{max-width:none;font-size:18px}
.app[data-device=desktop] .sub{padding:0 0 14px}
.app[data-device=desktop] .mooc,.app[data-device=desktop] .st,.app[data-device=desktop] .fd{margin-inline:0}
.app[data-device=desktop] .mooc h1{font-size:32px}
.app[data-device=desktop] .mooc .top{max-width:880px}
.app[data-device=desktop] .mooc .tabs{width:max-content;max-width:100%}
.app[data-device=desktop] .fd{padding-bottom:120px;grid-template-columns:1fr 1fr}
.app[data-device=desktop] .dock{left:50%;right:auto;transform:translateX(-50%);width:auto;
 justify-content:center;gap:6px;padding:0 14px}
.app[data-device=desktop] .drop{right:26px;bottom:104px}

@media (prefers-reduced-motion:reduce){.app *{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ══════════════ 01 · CRISTAL — verre net, arêtes fines, lumière froide ══════════════ */
.t1{--bg0:#F4F8FC;--ink:#0C2033;--ink2:#41586F;--mut:#8095AA;
 --acc:#0B7FE0;--accSoft:rgba(11,127,224,.09);--accBd:rgba(11,127,224,.34);--pros:#00B07A;
 --warm:#E8642F;--warmSoft:rgba(232,100,47,.09);--warmBd:rgba(232,100,47,.3);
 --gold:#9A7014;--goldSoft:#FDF6E2;--goldBd:#F0DCA4;--alert:#E8503C;
 --panel:rgba(255,255,255,.76);--well:rgba(12,32,51,.05);--chip:rgba(255,255,255,.8);--chipH:#fff;
 --bd:1px solid rgba(12,32,51,.1);--bdSoft:rgba(12,32,51,.14);--blur:blur(18px) saturate(1.3);
 --brandGrad:linear-gradient(145deg,#3E9BFF,#0B5FD0);--brandInk:#0B5FD0;--ring:#0B7FE0;
 --r-sm:12px;--r-md:15px;--r-lg:20px;--r-rnd:999px;--r-dock:24px;--r-arch:22px;
 --sh-xs:0 1px 2px rgba(12,32,51,.06);--sh-sm:0 6px 16px -8px rgba(12,45,80,.3);
 --sh-md:0 14px 34px -18px rgba(12,45,80,.34);--sh-lg:0 24px 50px -22px rgba(12,45,80,.4);

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(r){
 const tabs=[...r.querySelectorAll('.tabs button')];
 tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-current','false'));t.setAttribute('aria-current','true');});
 const dk=[...r.querySelectorAll('.dock button')];
 dk.forEach(b=>b.onclick=()=>{dk.forEach(x=>x.setAttribute('aria-current','false'));b.setAttribute('aria-current','true');});
 // poussière de lumière — présente dans les cinq, jamais figée
 const cv=r.querySelector('.motes'),cx=cv.getContext('2d');
 const cs=getComputedStyle(r),c1=(cs.getPropertyValue('--pros')||'#10B981').trim(),
       c2=(cs.getPropertyValue('--acc')||'#0B7FE0').trim();
 let raf=0,ps=[];
 const init=()=>{cv.width=cv.offsetWidth*devicePixelRatio;cv.height=cv.offsetHeight*devicePixelRatio;
  ps=Array.from({length:46},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
   r:(.9+Math.random()*2.4)*devicePixelRatio,v:(.10+Math.random()*.34)*devicePixelRatio,
   a:.10+Math.random()*.30,c:Math.random()>.45?c1:c2,ph:Math.random()*6.3}));};
 init();
 let t=0;
 const draw=()=>{cx.clearRect(0,0,cv.width,cv.height);
  for(const p of ps){cx.globalAlpha=p.a*(.6+.4*Math.sin(t+p.ph));cx.fillStyle=p.c;
   cx.beginPath();cx.arc(p.x+Math.sin(t*.6+p.ph)*6,p.y,p.r,0,6.3);cx.fill();
   if(!RM){p.y-=p.v;if(p.y<-6)p.y=cv.height+6;}}
  cx.globalAlpha=1;if(!RM)t+=.012;raf=requestAnimationFrame(draw);};
 draw();
 return()=>cancelAnimationFrame(raf);
}

const app=document.getElementById('app'),frame=document.getElementById('frame');
let device='mobile',cur=0,clean=null;
function render(){
 if(clean){try{clean()}catch(e){}clean=null;}
 const t=T[cur];
 app.className='app '+t.cls;app.dataset.device=device;
 app.innerHTML=screen(t.cls==='t2'?'<div class="aur"></div>':'');
 clean=wire(app);
 document.getElementById('mid').textContent=String(t.n).padStart(2,'0')+' / 05';
 document.getElementById('mname').textContent=t.name;
 document.getElementById('mprin').textContent=t.prin;
 document.getElementById('cMat').textContent=t.mat;
 document.getElementById('cForm').textContent=t.form;
 document.getElementById('cCol').textContent=t.col;
 document.getElementById('cMove').textContent=t.move;
 frame.dataset.device=device;
 [...document.querySelectorAll('.dot')].forEach((d,i)=>d.setAttribute('aria-current',String(i===cur)));
}
const dots=document.getElementById('dots');
T.forEach((t,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=t.n;
 b.setAttribute('role','tab');b.title=t.name;b.onclick=()=>{cur=i;render();};dots.appendChild(b);});
document.getElementById('prev').onclick=()=>{cur=(cur+T.length-1)%T.length;render();};
document.getElementById('next').onclick=()=>{cur=(cur+1)%T.length;render();};
document.getElementById('bDesk').onclick=()=>{device='desktop';
 document.getElementById('bDesk').setAttribute('aria-pressed','true');
 document.getElementById('bMob').setAttribute('aria-pressed','false');render();};
document.getElementById('bMob').onclick=()=>{device='mobile';
 document.getElementById('bMob').setAttribute('aria-pressed','true');
 document.getElementById('bDesk').setAttribute('aria-pressed','false');render();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();
 if(e.key==='ArrowLeft')document.getElementById('prev').click();});
render();
</script>
