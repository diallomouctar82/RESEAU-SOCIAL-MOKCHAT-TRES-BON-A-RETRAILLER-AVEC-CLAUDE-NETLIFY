[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/ai/connectors"
  to = "/.netlify/functions/ai-connectors"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/tts/voices"
  to = "/.netlify/functions/tts-voices"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
