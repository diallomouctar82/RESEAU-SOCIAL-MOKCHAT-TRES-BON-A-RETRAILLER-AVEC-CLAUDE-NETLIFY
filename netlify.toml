# Configuration Netlify — MokNet
#
# Ce fichier ne contient QUE des en-têtes de réponse. Il est repris du
# `netlify/netlify.toml` du paquet Architecte (AI Studio), dont c'était le seul
# apport réellement utile : quatre en-têtes de sécurité mesurés absents du
# déploiement réel (seul `Strict-Transport-Security`, posé par Netlify
# lui-même, était servi).
#
# Ce qui n'est PAS repris du fichier d'origine, délibérément :
#
#   • le bloc `[build]` — les trois sites Netlify de MokNet sont configurés
#     par l'interface et fonctionnent ; en plus, son `functions =
#     "netlify/functions"` désigne un répertoire qui n'existe pas ici.
#   • la redirection `/api/*` — elle route vers une fonction serverless dont
#     l'endpoint `/config` renvoie la clé Gemini en clair, avec un CORS
#     `Access-Control-Allow-Origin: *`, donc lisible par n'importe quel
#     domaine. MokNet passe par l'Edge Function `ai-gateway`, clés en Vault
#     côté serveur.
#
# L'absence de section `[build]` est intentionnelle : Netlify conserve alors la
# configuration de build définie dans l'interface pour chacun des trois sites.

[[headers]]
  for = "/*"

  [headers.values]
    # Empêche l'intégration de MokNet dans une iframe d'un autre domaine
    # (détournement de clic). `SAMEORIGIN` plutôt que `DENY` : aucun code du
    # dépôt ne détecte d'auto-intégration, mais `SAMEORIGIN` couvre le besoin
    # sans risquer de casser un usage interne non repéré.
    X-Frame-Options = "SAMEORIGIN"

    # Interdit au navigateur de deviner un type MIME différent de celui
    # annoncé — évite qu'un fichier téléversé soit interprété comme un script.
    X-Content-Type-Options = "nosniff"

    # L'URL complète n'est transmise qu'aux destinations de même origine ; vers
    # l'extérieur, seul le domaine part, et rien du tout en HTTP non chiffré.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Chaque entrée correspond à un usage RÉEL, vérifié dans le dépôt avant
    # d'écrire cette ligne — une politique inventée bloquerait des
    # fonctionnalités qui marchent aujourd'hui :
    #   camera + microphone → LIVE, appels, Architecte vocal, scanner
    #                         (getUserMedia/getDisplayMedia dans 10 fichiers)
    #   geolocation         → HealthCenter (navigator.geolocation)
    #   payment, usb        → aucun usage nulle part : refusés explicitement
    # `(self)` n'élargit rien — c'est déjà le défaut du navigateur pour ces
    # trois-là ; l'écrire empêche en revanche une iframe tierce de les demander.
    # Les fonctionnalités non listées gardent le comportement par défaut du
    # navigateur, délibérément : en verrouiller une par excès de zèle casserait
    # un usage existant sans rien protéger de plus.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()"

# ─── Modules exportables — route autonome de la messagerie ───
#
# Exception volontaire à la note d'en-tête (« que des en-têtes ») : deux
# réécritures SPA, et rien d'autre. `/messagerie` est la `start_url` du
# manifeste du module (public/manifests/messagerie.webmanifest) et l'URL que
# l'icône installée sur le téléphone ouvre ; sans ces lignes, Netlify
# répondrait 404 (aucun fichier de ce nom dans `dist/`). Statut 200 : l'URL
# reste `/messagerie` dans la barre d'adresse, et l'application, servie par
# index.html, détecte cette route au démarrage (services/modules/
# standaloneMode.ts) pour ne rendre que le module. Les autres chemins gardent
# leur comportement : l'application principale navigue par hash (#onglet) et
# n'a jamais eu besoin d'une réécriture générale.
# ─── Domaine canonique — normalisation de toutes les écritures ───
#
# Accès public (Direction, 05/09/2026, DEC-2026-081) : quel que soit le canal
# qui ouvre le lien (SMS, WhatsApp, Messenger, navigateur du téléphone ou de
# l'ordinateur, navigateur intégré d'une application) et quelle que soit
# l'écriture du domaine (`Moknet.net`, `MOKNET.NET`, avec ou sans `www`,
# majuscule automatique d'un clavier), la page servie est TOUJOURS
# `https://moknet.net/…`, en minuscules, avant que l'application ne démarre —
# donc avant le verrou d'authentification, qui s'applique ensuite à tout le
# monde de la même façon.
#
# Les majuscules ne demandent aucune règle : un nom de domaine est insensible
# à la casse (DNS) et tout navigateur l'écrit en minuscules avant d'envoyer la
# requête (norme URL). Les trois règles ci-dessous fixent, dans le dépôt, ce
# que la configuration du site faisait jusqu'ici implicitement (domaine
# principal `moknet.net`) : `www` → domaine nu et `http` → `https`, par
# redirection permanente (301), forcée (`force = true`) pour qu'aucun fichier
# ne puisse les court-circuiter. Chaîne mesurée en production : un saut pour
# `https://www…` et `http://moknet.net`, au plus deux pour `http://www…` (la
# redirection TLS automatique de Netlify passe d'abord), toujours vers
# `https://moknet.net`. Elles ne s'appliquent QUE quand la
# requête porte ces hôtes : les deux autres sites Netlify de MokNet, qui
# partagent ce fichier, ne les voient jamais.
#
# GARDE-FOU : si le domaine principal du site changeait un jour (par exemple
# pour `www.moknet.net`), ces règles devraient changer avec lui, sans quoi la
# redirection automatique de Netlify et celles-ci se renverraient l'une à
# l'autre en boucle. Test : tests/netlifyRedirectsCanoniques.test.ts.
[[redirects]]
  from = "https://www.moknet.net/*"
  to = "https://moknet.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.moknet.net/*"
  to = "https://moknet.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://moknet.net/*"
  to = "https://moknet.net/:splat"
  status = 301
  force = true

# Démonstration publique de l'avatar de l'Architecte : route rendue par
# l'application avant l'écran de connexion. Sans cette réécriture, l'URL
# renvoie 404 et la page n'est jamais atteinte.
[[redirects]]
  from = "/architecte"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/messagerie"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/messagerie/*"
  to = "/index.html"
  status = 200
