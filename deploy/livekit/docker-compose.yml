# Déploiement LiveKit Server auto-hébergé (LOOP 15/16) — Redis + Caddy (TLS
# automatique Let's Encrypt) + LiveKit Server (signalisation + média RTC).
#
# Architecture "ports & adapters" respectée (voir services/live/liveTransportTypes.ts,
# services/live/liveKitTransportProvider.ts) : ce serveur ne remplace qu'une
# LIGNE de configuration dans la table Supabase `live_transport_config`
# (environment='production') — aucun code applicatif ne change entre le
# serveur de développement local (`livekit-server --dev`, LOOP 01/16) et ce
# déploiement. Voir README.md de ce dossier pour les étapes manuelles.
#
# ─── ⚠️ CE FICHIER DÉCRIT LA CIBLE, PAS LA MACHINE EN SERVICE ──────────────
#
# Le VPS tourne depuis le 30/08/2026 une configuration qui DIVERGE de
# celle-ci sur trois points, appliqués sur place et jamais reportés ici
# (constaté le 04/09/2026 en relisant l'historique de ce fichier) :
#
#   1. AUCUN service `caddy`. Un site de production existant occupait déjà
#      80/443 ; TLS et reverse-proxy sont délégués à CloudPanel/nginx vers
#      LiveKit sur 127.0.0.1:7880.
#   2. `livekit/livekit-server:v1.8.4` — la montée vers la v1.13.6 épinglée
#      ci-dessous est PLANIFIÉE, pas faite (voir README.md, « Version du
#      serveur et version du SDK »).
#   3. `relay_range_start: 30000` / `relay_range_end: 30100` dans le bloc
#      `turn`. Sans ces deux lignes, la plage TURN par défaut (10 001 ports)
#      fait échouer le démarrage du conteneur — timeout du userland-proxy
#      Docker, mesuré sur ce VPS.
#
# CONSÉQUENCE, ET ELLE EST GRAVE : recopier ce dossier tel quel sur le VPS
# (`scp -r deploy/livekit …`) écraserait le fichier ajusté à la main, puis
# `docker compose up -d` démarrerait Caddy, qui réclamerait les ports 80 et
# 443 — donc COUPERAIT LE SITE DE PRODUCTION déjà hébergé sur cette machine,
# et monterait le serveur média de version sans que personne l'ait demandé.
#
# Pour modifier la configuration en service, on édite le fichier DU VPS
# (`/opt/moknet-livekit/docker-compose.yml`), ligne par ligne, jamais par
# recopie de ce dossier. Recette exacte : README.md, « Étape 3 ».

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  livekit:
    # AU-14 — VERSION ÉPINGLÉE, et volontairement PAS une étiquette flottante.
    #
    # Ce qui s'est passé : `v1.8` (flottante) a résolu vers 1.8.4 (mars 2025),
    # qui parle le protocole 15. Le SDK du site était `livekit-client` 2.22.1,
    # qui parle le protocole 17 et commence par demander le chemin de
    # signalisation `/rtc/v1`. Les rapports de diagnostic de deux vrais
    # appareils (public.call_diagnostics, 02/09/2026) montrent la suite, mot
    # pour mot et des DEUX côtés :
    #
    #   connected to Livekit Server ... version: 1.8.4, protocol: 15
    #   Initial connection failed: v1 RTC path not found.
    #                              Consider upgrading your LiveKit server version
    #   ... puis, toutes les ~16 s :
    #   NegotiationError: negotiation timed out
    #   → toutes les pistes distantes retirées, reconnexion complète,
    #     micro republié puis dépublié, `bytesSent` jamais autre chose que null.
    #
    # Conséquences vécues par l'utilisateur : la voix ne part JAMAIS (l'autre
    # n'entend rien), le son reçu se coupe et revient sans arrêt, et la
    # connexion se rétablit en boucle pendant tout l'appel.
    #
    # Une étiquette flottante a donc figé le serveur sur une version qui a
    # vieilli sous le client : on épingle désormais la version exacte, et on la
    # monte délibérément (voir README.md, section « Version du serveur et
    # version du SDK »). En attendant cette montée, le site épingle
    # `livekit-client` 2.17.3 — mesuré sans expiration contre 1.8.4 ET 1.13.6.
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # LiveKit accepte sa configuration complète via cette variable (YAML
      # en ligne) — évite un fichier séparé à interpoler au démarrage du
      # conteneur. Substitution faite par docker compose lui-même à partir
      # de .env.production, avant que le conteneur ne démarre.
      LIVEKIT_CONFIG: |
        port: 7880
        # SAT-1 — LE SEUL ENDROIT QUI DIT LA TAILLE DE LA MACHINE.
        #
        # Sans cette ligne, `/metrics` répond 404 (mesuré au banc contre 1.8.4
        # ET 1.13.6, sur le port principal comme sur tout autre). Or c'est la
        # seule source qui expose `go_sched_gomaxprocs_threads`, le nombre de
        # cœurs — et donc la seule façon de faire suivre le plafond d'un direct
        # à la machine sans qu'un humain saisisse un chiffre.
        #
        # Sans elle, SAT-1 ne pose AUCUN plafond : la porte SAT-2 reste en
        # place mais ne refuse personne, exactement comme avant. Aucune panne,
        # aucune régression — simplement une protection inactive.
        #
        # Ce que ces métriques contiennent, VÉRIFIÉ ligne par ligne au banc :
        # des agrégats et des compteurs Go. Étiquettes présentes : code,
        # direction, le, method, node_id, node_type, quantile, service, status,
        # transmission, version. ZÉRO nom de room, ZÉRO identité de
        # participant. Les exposer ne divulgue donc pas de donnée personnelle —
        # seulement la charge du nœud.
        prometheus_port: 6789
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        turn:
          enabled: true
          udp_port: 3478
    ports:
      # Média RTC (WebRTC) — UDP prioritaire, TCP en repli si UDP bloqué par le réseau du participant.
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
      # Relais TURN (UDP) — pour les participants derrière un NAT/pare-feu strict.
      - "3478:3478/udp"
      # Métriques SAT-1 — liées à la BOUCLE LOCALE, jamais ouvertes sur
      # Internet par ce fichier. LiveKit ne protège pas cet endpoint : c'est le
      # reverse-proxy qui doit le publier derrière un jeton, et lui seul.
      # Recette exacte dans README.md, section « SAT-1 ».
      - "127.0.0.1:6789:6789/tcp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "80:80"
      - "443:443"
    environment:
      LIVEKIT_DOMAIN: "${LIVEKIT_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
